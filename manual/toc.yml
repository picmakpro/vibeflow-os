# manual/toc.yml — séquence canonique du manuel utilisateur VibeFlow (D-03).
#
# INVARIANT NON NEGOCIABLE : n'inscrire une entrée `pages:` qu'APRES avoir écrit la page
# dans LES DEUX langues (manual/fr/<path_fr> ET manual/en/<path_en>). Une entrée inscrite
# sans les deux fichiers fait échouer manual/.tools/check-manual.sh (contrôle C2). De même,
# `themes:` ne liste que les thèmes ayant déjà au moins une page inscrite.
#
# Ordre fixe des 7 thèmes (D-05, trajectoire Diátaxis — jamais réordonné) :
#   get-started -> concepts -> modules -> development-cycle -> agent-team
#   -> reference -> under-the-hood
#
# Disposition (D-02) : profondeur DEUX niveaux, manual/<lang>/NN-theme/slug.md. Le préfixe
# numérique porte sur le DOSSIER seulement — jamais sur un fichier (GitHub n'a pas de build
# step : un numéro dans un nom de fichier entrerait dans l'URL, et renuméroter casserait tous
# les liens entrants et croisés).
#
# H-1 LEVÉE (26-CONTEXT.md posait : "les slugs de fichiers sont identiques en FR et EN").
# Décision du 2026-08-02 (wave 26-10) : sous manual/en/, dossiers ET fichiers portent des
# slugs anglais idiomatiques (traduction, pas translittération) — ex. 01-demarrer/prerequis.md
# devient 01-get-started/prerequisites.md. L'appariement FR<->EN ne se déduit donc plus du
# chemin seul : chaque entrée porte désormais un `id` logique stable PLUS un chemin par
# langue (`dir_fr`/`dir_en` pour les thèmes, `path_fr`/`path_en` pour les pages). C'est cette
# paire explicite — pas la ressemblance des chemins — que lisent build-nav.sh (bandeaux, y
# compris le sélecteur de langue) et check-manual.sh (contrôles C1/C2). Un chemin FR et un
# chemin EN qui se ressembleraient encore par coïncidence (ex. `installation.md` des deux
# côtés) ne sont PAS un cas particulier : ils passent par la même paire `path_fr`/`path_en`
# que n'importe quelle autre entrée.
#
# Forme : YAML restreint volontairement parsable en bash pur (awk/sed, aucune dépendance) —
# indentation à 2 espaces, une clé par ligne, aucune ancre, aucune valeur multi-ligne.
# L'ordre des entrées `pages:` EST l'ordre de lecture (prev/next du bandeau de navigation).

