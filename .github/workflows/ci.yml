# CI vibeflow-os — le repo se soumet enfin à ses propres gates (audit 2026-07-25 : F13/F14/P1-b).
#
# Principe (contrat de découverte, F13) : chaque job ASSERTE que sa découverte est non vide
# avant de rendre un verdict — 0 suite trouvée ou 0 dossier d'agents trouvé = échec, jamais
# un vert par absence de cible (« vacuous green »).
#
# check-release-tag ne tourne que sur main : une branche de feature porte légitimement une
# VERSION dont le tag n'existe pas encore (le tag est posé après merge, cf. CLAUDE.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Suites de tests (découverte non vide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (bash, jq, python3)
        run: |
          bash --version | head -1
          jq --version
          python3 --version

      # Node 22+ est un prérequis DUR de @opengsd/gsd-core (garde explicite dans
      # plugin/dev-orchestrator/scripts/ensure-deps.sh). Épinglé ici plutôt que subi depuis l'image
      # du runner : une image qui redescendrait sous 22 ferait échouer l'install, donc les cas 20/26.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le moteur GSD (@opengsd/gsd-core@^1) — sans lui, deux cas ne peuvent rien prouver
        run: |
          set -eu
          # POURQUOI (arbitrage A-7, Phase 23). Les cas 20 et 26 de
          # plugin/dev-orchestrator/scripts/tests/test-check-gsd-config.sh tournent contre le moteur
          # RÉELLEMENT INSTALLÉ — c'est leur raison d'être : compteur d'ATTEINTE (20) et détection de
          # dérive du mirroir engineExtra (26). Sur un runner sans moteur ils sortent en `ko`, et ils
          # sortent en `ko` À BON DROIT. Ils ne doivent JAMAIS être dégradés en `skip`, en `ok`
          # conditionnel, ni être entourés d'un `|| true` : ce serait rouvrir le « vert à vide » qu'ils
          # existent pour fermer. La cause se traite ICI, dans l'environnement d'exécution.
          #
          # OÙ (cascade de check-gsd-config.sh — DEUX branches, premier trouvé gagne) :
          #   1. <repo>/.claude/gsd-core/bin/lib             — ÉCARTÉE : ce dépôt ignore .claude/
          #      délibérément (« le repo est la SOURCE des modules, PAS un lab », .gitignore) ;
          #      y déposer le distribuable contredirait cette règle et déplacerait le GSD_HOME dérivé
          #      par check-gsd-engine.sh / ensure-deps.sh.
          #   2. $HOME/.claude/gsd-core/bin/lib               — CELLE-CI : c'est ce que pose
          #      l'installeur officiel en scope global, et c'est la topologie d'un poste de dev réel.
          #
          # Une TROISIÈME branche existait, <repo>/node_modules/@opengsd/gsd-core/bin/lib, et elle a
          # été RETIRÉE du script (arbitrage A-10). C'est ce job qui l'avait mesurée morte : le
          # paquet publié dépose son payload sous .../@opengsd/gsd-core/gsd-core/bin/lib — DOUBLE
          # SEGMENT. Un bin/lib existe bien un cran plus haut, mais il ne contient que
          # ui-safety-gate.cjs, pas config.cjs : le `[ -f "$candidate/config.cjs" ]` de la cascade
          # n'y a jamais réussi, sur aucune version (défaut identique 1.8.0 / 1.9.0). Ne pas la
          # rétablir « au cas où » : elle ouvrirait une voie de résolution neuve pour un moteur non
          # maîtrisé, au moment précis où l'on ferme un vecteur d'exécution de code.
          #
          # COMMENT : la commande du dépôt lui-même (ensure-deps.sh), plafond "^1" — dernier 1.x, mais
          # un saut de MAJEURE reste une décision humaine (arbitrage 2026-07-26, audit Phase 11).
          npx -y "@opengsd/gsd-core@^1" --claude --global

          # Échec VISIBLE : l'installeur peut sortir 0 sans avoir posé le payload attendu (changement
          # de layout amont, install partielle). Sans cette assertion, les cas 20/26 repartiraient en
          # `ko` en accusant la suite alors que la panne est ici.
          LIB="$HOME/.claude/gsd-core/bin/lib"
          for f in config.cjs config-loader.cjs capability-registry.cjs configuration.cjs; do
            if [ ! -f "$LIB/$f" ]; then
              echo "::error::moteur GSD absent après install : $LIB/$f introuvable — les cas 20 et 26 de test-check-gsd-config.sh ne pourraient rien prouver"
              exit 1
            fi
          done
          echo "== moteur GSD $(cat "$HOME/.claude/gsd-core/VERSION" 2>/dev/null || echo '?') résolu par la branche 3 de la cascade : $LIB =="

      # ------------------------------------------------------------------------------------------
      # CANARI DE FORME DU MOTEUR GSD (arbitrage A-9, voie c d'O-13)
      #
      # POURQUOI ICI ET PAS DANS UNE SUITE. Les scripts qui couplent ce dépôt au moteur GSD ne
      # l'exécutent plus, ils le LISENT (arbitrage A-6). Le prix de cette mesure est qu'une lecture
      # de texte ne suit AUCUNE indirection : le jour où le moteur déplace un manifeste, écrit
      # `new Set(VARIABLE)` ou calcule ses défauts, l'extraction rend zéro. Le script le DIT
      # désormais (signal « moteur périmé »), mais il le dit sur le poste de l'utilisateur, au
      # SessionStart, sous le `|| true` du hook — c'est-à-dire au pire endroit possible. Ce canari
      # déplace la détection ICI : il rougit à la première montée de version qui casse la forme
      # lisible, avant que quiconque ne le découvre en session.
      #
      # CE QU'IL MESURE, ET POURQUOI IL NE PEUT PAS ÊTRE VERT À VIDE. Trois discriminants dans UN
      # SEUL fichier audité, un par source de clés connues — un jeu de clés vide échouerait sur le
      # premier, un jeu universel sur le second :
      #   1. `bloc_canari_inexistant` DOIT être signalé  → source 1 (VALID_CONFIG_KEYS) lue, et
      #      discriminante : elle ne reconnaît pas n'importe quoi ;
      #   2. `workflow.ui_review`, ÉCRIT dans le fichier, ne doit PAS être signalé inconnu →
      #      source 2 (configKeys du registre) lue : c'est la SEULE source où cette clé existe ;
      #   3. au moins 3 toggles rendus « au défaut amont (valeur) » → source 3 (CONFIG_DEFAULTS)
      #      lue AVEC ses valeurs. C'est le mode d'échec le plus vicieux : des défauts calculés
      #      laissent le gate parler tout en affirmant des absences fausses.
      #   4. AUCUN signal « moteur périmé » — la garde générale, qui couvre les trois sources.
      #
      # SECOND SCRIPT DU MODULE — IMPLÉMENTÉ (Phase 23, plan 23-04b, arbitrage A-12). Le point
      # d'extension annoncé ici a été tenu : build-gsd-capabilities-index.sh a basculé lui aussi en
      # lecture de texte (require(registryPath) fermait T-23-04-07, une RCE de même vecteur que
      # celle fermée sur check-gsd-config.sh) et sa sonde vit plus bas, DANS CETTE MÊME ÉTAPE, sous
      # le même `set -eu` et le même bilan `fail`/`note` — toujours pas de second job, pas de `|| true`.
      - name: Canari de forme du moteur GSD (lecture de texte — check-gsd-config.sh)
        run: |
          set -eu
          LAB="$(mktemp -d)"
          mkdir -p "$LAB/.planning"
          cat > "$LAB/.planning/config.json" <<'JSON'
          { "bloc_canari_inexistant": { "x": 1 },
            "workflow": { "ui_review": false } }
          JSON

          # La cascade du script est laissée faire (branche $HOME, posée à l'étape précédente) : le
          # canari doit mesurer le chemin RÉEL, pas une surcharge d'environnement.
          out="$(env -u VF_CONFIG_PATH -u VF_GSD_CORE_LIB bash plugin/dev-orchestrator/scripts/check-gsd-config.sh --path "$LAB" 2>/dev/null)" || rc=$?
          rc="${rc:-0}"
          rm -rf "$LAB"
          echo "== sortie du gate (rc=$rc) =="
          printf '%s\n' "$out"

          fail=0
          note() { echo "::error::canari de forme du moteur GSD : $1"; fail=$((fail + 1)); }

          case "$rc" in 0|3|64) : ;; *) note "rc=$rc HORS du contrat de sortie {0, 3, 64}" ;; esac

          case "$out" in
            *"une source de clés connues n'a rien rendu"*)
              note "le gate se déclare PÉRIMÉ sur le moteur installé — la forme du moteur a changé et la lecture de texte ne la suit plus. Corriger l'extraction dans check-gsd-config.sh ; ne PAS neutraliser ce canari." ;;
          esac

          case "$out" in
            *bloc_canari_inexistant*) : ;;
            *) note "source 1 (VALID_CONFIG_KEYS) : un bloc de premier niveau qui n'existe dans AUCUNE version du moteur n'est pas signalé — les clés connues ne sont plus lues, ou l'ensemble lu est devenu universel" ;;
          esac

          # La clé est cherchée SUR la ligne des sous-clés inconnues, jamais dans tout le blob : une
          # co-présence (« inconnues » ici, « ui_review » trois lignes plus bas) ferait rougir le
          # canari pour la mauvaise raison.
          sub_line="$(printf '%s\n' "$out" | awk '/sous-clés inconnues/ { print }')"
          case "$sub_line" in
            *ui_review*)
              note "source 2 (configKeys du registre de capabilities) : workflow.ui_review est signalé inconnu alors qu'il est ÉCRIT et légitime — c'est la seule source où cette clé existe, elle n'est donc plus lue" ;;
          esac

          n_def="$(printf '%s\n' "$out" | awk '/au défaut amont \(/ { n++ } END { print n+0 }')"
          echo "== toggles rendus avec leur défaut amont : $n_def =="
          if [ "$n_def" -lt 3 ]; then
            note "source 3 (CONFIG_DEFAULTS) : seulement $n_def toggle(s) rendu(s) avec une valeur de défaut lue (plancher 3). Des défauts devenus calculés font AFFIRMER au gate des absences fausses."
          fi

          # ----------------------------------------------------------------------------------------
          # CANARI DE FORME DU MOTEUR GSD — GÉNÉRATEUR (arbitrage A-12, T-23-04-07). Même principe :
          # build-gsd-capabilities-index.sh ne require() plus le registre de capabilities, il le LIT
          # (le vecteur qu'il fermait — un capability-registry.cjs piégé résolu depuis le dépôt audité
          # exécuté par require() — est le MÊME que celui fermé par check-gsd-config.sh sous A-6). Le
          # prix est le même aussi : une lecture de texte ne suit aucune indirection, donc le jour où
          # le moteur déplace ou calcule `byLoopPoint`, l'extraction échoue. Le générateur le DIT
          # (« EXTRACTION PERIMEE », rc=1) au lieu de produire un index tronqué ou périmé en silence.
          #
          # CE QU'IL MESURE, ET POURQUOI IL NE PEUT PAS ÊTRE VERT À VIDE :
          #   1. le générateur tourne contre le moteur RÉELLEMENT installé (posé à l'étape
          #      précédente) et DOIT réussir (rc=0), sans jamais afficher le signal périmé — sinon la
          #      forme de `byLoopPoint` a changé et la lecture de texte ne la suit plus ;
          #   2. la table produite nomme un point de hook réellement déclaré par CE moteur
          #      (`plan:pre`, présent sur toute version connue) — sans ce plancher, un générateur qui
          #      ne lirait plus rien satisferait « rc=0 » sur une table vide.
          # Sortie dans un TEMPORAIRE, jamais dans references/gsd-capabilities-index.md : ce canari
          # mesure la LISIBILITÉ du moteur, il ne doit pas modifier le fichier versionné du checkout.
          gen_out="$(mktemp)"
          gen_index="$(mktemp)"
          gen_rc=0
          VF_GSD_CORE_LIB="$HOME/.claude/gsd-core/bin/lib" VF_CAPS_INDEX_OUT="$gen_index" \
            bash plugin/dev-orchestrator/scripts/build-gsd-capabilities-index.sh \
            > /dev/null 2>"$gen_out" || gen_rc=$?
          echo "== sortie du générateur (rc=$gen_rc) =="
          cat "$gen_out"

          case "$gen_rc" in 0|1) : ;; *) note "générateur : rc=$gen_rc HORS du contrat de sortie {0, 1}" ;; esac
          if [ "$gen_rc" -ne 0 ]; then
            note "générateur : n'a PAS réussi contre le moteur installé (rc=$gen_rc) — voir la sortie ci-dessus"
          fi
          case "$(cat "$gen_out")" in
            *"EXTRACTION PERIMEE"*)
              note "générateur : se déclare PÉRIMÉ sur le moteur installé — la forme de byLoopPoint a changé et la lecture de texte ne la suit plus. Corriger l'extraction dans build-gsd-capabilities-index.sh ; ne PAS neutraliser ce canari." ;;
          esac
          if grep -qF 'plan:pre' "$gen_index" 2>/dev/null; then
            :
          else
            note "générateur : le point de hook plan:pre (présent sur toute version connue du moteur) n'apparaît pas dans l'index régénéré — la table produite est vide ou n'a pas été régénérée"
          fi
          rm -f "$gen_out" "$gen_index"

          if [ "$fail" -ne 0 ]; then
            echo "== canari ROUGE : $fail écart(s) entre la forme attendue du moteur et la forme lisible =="
            exit 1
          fi
          echo "== canari VERT : les trois sources du moteur installé restent lisibles par extraction de texte, ET le registre de capabilities reste lisible par le générateur =="

      - name: Découvrir et lancer toutes les suites
        run: |
          set -u
          suites=$(find plugin scripts -type f -path '*/tests/test-*.sh' | sort)
          count=$(printf '%s\n' "$suites" | grep -c . || true)
          echo "== $count suite(s) découverte(s) =="
          # Assertion de découverte non vide (F13) : 0 suite = échec, pas un vert.
          if [ "$count" -eq 0 ]; then
            echo "::error::aucune suite de tests découverte (pattern */tests/test-*.sh) — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          fail=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              rc=$?
              echo "::error::FAIL(rc=$rc) $t"
              fail=$((fail + 1))
            fi
            echo "::endgroup::"
          done <<EOF
          $suites
          EOF
          echo "== bilan : $count suite(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

  gates:
    name: Gates de qualité (mode strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique + tags complets (check-release-tag)

      - name: check-agents --strict sur chaque plugin/*/agents (découverte non vide)
        run: |
          set -u
          found=0
          fail=0
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            found=$((found + 1))
            echo "== $d =="
            # --strict : skills déclarés doivent exister + cible vide → exit 3 (INDÉTERMINÉ ≠ vert)
            bash plugin/conductor/scripts/check-agents.sh --strict --agents-dir="$d" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun dossier plugin/*/agents découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found dossier(s) d'agents vérifié(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-agents --strict sur chaque plugin/*/AGENT.md (module mono-agent)
        # POURQUOI CETTE ÉTAPE EXISTE : le balayage ci-dessus ne voit QUE `plugin/*/agents/`, alors
        # que l'installeur pose DEUX familles d'agents dans `.claude/agents/` — `agents/<nom>.md`
        # (Type 3b) ET `AGENT.md` à la racine du module (Type 3, `vibeflow-update.sh` : `cp
        # "$module_dir/AGENT.md" "$TARGET_ROOT/agents/${mod}.md"`). La population réelle est de 31
        # fichiers, pas 25. Un durcissement de check-agents.sh (l'exigence de `effort:`) appliqué
        # aux seuls 25 a donc laissé passer 5 modules non conformes jusqu'au Gate C du lab frais,
        # qui les découvre trop tard et sous `set -eu`. Le gate par module doit voir la MÊME
        # population que l'install, sinon il rend un vert sur un sous-ensemble.
        run: |
          set -u
          found=0
          fail=0
          # `--file <path>` en DEUX arguments : la forme `--file=<path>` n'est PAS reconnue par
          # check-agents.sh (seul `--agents-dir=` accepte le `=`), elle dégrade en cible vide —
          # et sans `--strict`, une cible vide rend 0. `--strict` est donc le garde-fou qui
          # transforme ce vert-à-vide en exit 3 audible : ne pas le retirer d'ici.
          for f in plugin/*/AGENT.md; do
            [ -f "$f" ] || continue
            found=$((found + 1))
            echo "== $f =="
            bash plugin/conductor/scripts/check-agents.sh --strict --file "$f" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun plugin/*/AGENT.md découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found AGENT.md vérifié(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-agents --resolve-agents=strict (monde fermé — union de tous les plugin/*/agents)
        # Le monde fermé n'est légitime qu'ici : la CI est le seul endroit où l'univers complet des
        # agents du repo est connu (cf. en-tête check-agents.sh). Chaque run par module ci-dessus
        # reste en lenient par défaut (ne pas durcir : c'est ce qui évite de rejouer les 66 faux
        # positifs tracés dans .planning/codebase/CONCERNS.md:52-59) — cette étape est un run
        # SUPPLÉMENTAIRE, indépendant du run lenient au-dessus.
        run: |
          set -u
          registry_args=()
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            registry_args+=("--agent-registry-dir=$d")
          done
          found=0
          fail=0
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            found=$((found + 1))
            echo "== monde fermé : $d =="
            bash plugin/conductor/scripts/check-agents.sh --strict --resolve-agents=strict --agents-dir="$d" "${registry_args[@]}" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun dossier plugin/*/agents découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found dossier(s) vérifiés en monde fermé, $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-version-sync (canon VERSION ↔ plugin.json ↔ marketplace ↔ badges ↔ triade par module)
        run: bash scripts/check-version-sync.sh

      - name: check-state-integrity (anti-régression du frontmatter .planning/STATE.md, ADR-063)
        # `--file` EXPLICITE, en défense en profondeur : sans lui, le fichier vérifié dépend de
        # l'environnement (GSD_WORKSTREAM, pointeur in-repo) et un simple `export` suffirait à
        # détourner le gate vers un autre STATE.md — ou à le désarmer. Le script fait primer
        # `--file` sur toute résolution de workstream (FILE_REL_EXPLICIT) : c'est précisément le
        # remède, il suffit que la CI l'utilise. Ce qui est protégé ici est le STATE.md de la
        # RACINE, celui dont ADR-063 garde les compteurs.
        run: bash plugin/conductor/scripts/check-state-integrity.sh --file .planning/STATE.md

      - name: check-capability-activation (une entrée de doc ne promet pas un geste inerte, GSDA-09)
        # POURQUOI CE CÂBLAGE EXISTE. Le gate était livré, testé, distribué dans chaque lab — et
        # référencé par RIEN d'exécutable : ni ce job, ni un hook, ni un agent, ni un skill. Sa
        # seule invocation vivait dans la suite du module. Une garde que la chaîne d'intégration ne
        # lance jamais est une garde absente : c'est exactement le mode d'échec (« routé, donc
        # réputé vivant ») que ce gate existe pour fermer, reproduit un étage plus haut sur
        # lui-même.
        #
        # Aucune surcharge `VF_CAPACT_*` : la cascade de résolution du lab est exercée telle qu'elle
        # tourne chez l'utilisateur. Un exit 2 (NON VÉRIFIABLE) échoue le job au même titre qu'un
        # exit 1 — un gate qui ne peut pas se prononcer n'est pas un gate vert.
        run: bash plugin/dev-orchestrator/scripts/check-capability-activation.sh

      - name: check-machine-paths (aucun chemin absolu de machine dans les fichiers versionnés)
        # POURQUOI CE GATE EST BLOQUANT ET PAS ADVISORY. Le défaut qu'il ferme est une ACCUMULATION,
        # pas un incident : mesurée le 2026-08-04, elle touchait 19 fichiers suivis dont 18 déjà
        # publiés sur `main`, tous écrits sans intention par des artefacts de session qui recopient
        # le chemin que l'outil leur a rendu. Un gate advisory sur une accumulation ne change pas la
        # pente — il documente la dérive pendant qu'elle continue. La ligne de base est à ZÉRO
        # depuis le nettoyage, donc le coût de le tenir vert est nul, et les trois échappatoires
        # (segment placeholder, segment non identifiant `<user>`, marqueur `vf-allow-machine-path`)
        # couvrent les besoins légitimes SANS qu'on ait à contourner le gate — c'est précisément le
        # motif qui a fait refuser `hooks.community` (ADR-067 : une mesure qu'on désarme en la
        # contournant tous les jours).
        #
        # `fetch-depth: 0` est déjà posé sur ce job (check-release-tag) : `git ls-files` a bien son
        # index. Un exit 2 (cible vide, hors dépôt git) échoue le job au même titre qu'un exit 1 —
        # un gate qui n'a pas pu regarder n'est pas un gate vert.
        run: bash scripts/check-machine-paths.sh

      - name: Gates workstream-aware sur un arbre RÉELLEMENT partitionné (fixture jetable) + non-régression racine
        # POURQUOI CETTE ÉTAPE EXISTE (plan 24-09, exigence GSDA-17). Les trois gates rendus
        # workstream-aware au plan 24-04 et le gate de pointeur créé au plan 24-05 sont tous VERTS
        # PAR DÉFAUT sur le checkout racine, qui n'est pas partitionné — et ce dépôt ne doit PAS
        # l'être tant qu'une phase est en vol. Leur comportement neuf n'est donc exercé NULLE PART
        # sans cette étape, et la couverture se retournerait en faux vert : exactement le trou que
        # la zone 3 referme. Le seul moyen honnête est que le job construise lui-même la partition,
        # PROUVE qu'elle est discriminante, et échoue si elle n'a pas pu être bâtie.
        #
        # `GSD_WORKSTREAM` est le canal exercé en premier : c'est le canal NOMINAL (ADR-064 amendé),
        # canal de premier rang de `resolveActiveWorkstream` amont.
        run: |
          set -eu

          fail=0
          note() { echo "::error::gates workstream : $1"; fail=$((fail + 1)); }

          # ═══ BLOC 1 — ASSERTION DE CAPACITÉ : les gates voient-ils une partition ? ═══════════
          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          mkdir -p "$FIX/.planning/workstreams/dev"
          printf '# Projet fixture\n\nArbre synthétique construit par la CI.\n' > "$FIX/.planning/PROJECT.md"
          printf '{ "workflow": {} }\n' > "$FIX/.planning/config.json"
          printf '# Feuille de route (compartiment dev)\n\n## Phase 1 : fixture\n\nObjectif synthétique.\n' \
            > "$FIX/.planning/workstreams/dev/ROADMAP.md"
          cat > "$FIX/.planning/workstreams/dev/STATE.md" <<'STATEEOF'
          ---
          milestone: fixture
          current_phase: 1
          status: in_progress
          progress:
            completed_phases: 0
            completed_plans: 0
            total_plans: 1
          ---

          Phase: 1 — fixture du compartiment dev

          Etat synthetique construit par la CI.
          STATEEOF

          # Dépôt git initialisé ET commité : check-state-integrity.sh exige un dépôt git et
          # compare le fichier de travail à HEAD. Sans commit il sortirait en 2 « non vérifiable »
          # et le job mesurerait la mauvaise chose. Identité locale : le runner n'en a pas.
          git -C "$FIX" init -q
          git -C "$FIX" add .planning
          git -C "$FIX" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture partitionnee"

          # --- Assertion de CONSTRUCTION, AVANT toute mesure (contrat F13, en-tête de ce fichier) ---
          for f in .planning/PROJECT.md .planning/config.json \
                   .planning/workstreams/dev/ROADMAP.md .planning/workstreams/dev/STATE.md; do
            if [ ! -f "$FIX/$f" ]; then
              echo "::error::fixture partitionnée non construite : $f manquant — refus de mesurer une cible absente"
              exit 1
            fi
          done
          # La racine du .planning de la fixture DOIT rester vide de ces deux fichiers : c'est
          # exactement ce qui rend la fixture discriminante (verdicts 5 et 6). Leur présence rendrait
          # le job vert sur une fixture qui ne prouve plus rien.
          for f in .planning/ROADMAP.md .planning/STATE.md; do
            if [ -e "$FIX/$f" ]; then
              echo "::error::fixture non discriminante : $f existe alors que la racine du .planning de la fixture doit en être VIDE"
              exit 1
            fi
          done
          echo "== fixture partitionnée construite et commitée : $FIX =="

          # --- 1/6 : gate de démarrage, workstream résolu par l'environnement ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX" 2>/dev/null)" || rc=$?
          echo "== 1/6 check-dev-bootstrap (GSD_WORKSTREAM=dev) rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 3 ] || note "1/6 check-dev-bootstrap : rc=$rc, attendu 3 (orientation gsd-engine)"
          case "$out" in
            *"Projet piloté par GSD"*) : ;;
            *) note "1/6 check-dev-bootstrap : stdout ne porte pas l'orientation « Projet piloté par GSD » — le compartiment dev n'a pas été lu" ;;
          esac
          case "$out" in
            *"[bootstrap]"*) note "1/6 check-dev-bootstrap : signal [bootstrap] rendu alors que le compartiment dev est complet — la résolution de workstream n'a pas eu lieu" ;;
          esac

          # --- 2/6 : gate d'intégrité d'état — le fichier VÉRIFIÉ doit être celui du compartiment ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/conductor/scripts/check-state-integrity.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 2/6 check-state-integrity rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "2/6 check-state-integrity : rc=$rc, attendu 0 (conforme)"
          case "$out" in
            *".planning/workstreams/dev/STATE.md conforme"*) : ;;
            *) note "2/6 check-state-integrity : le fichier vérifié n'est pas .planning/workstreams/dev/STATE.md — la résolution de workstream n'a pas eu lieu" ;;
          esac

          # --- 3/6 : injecteur de contexte. Contrat FAIL-OPEN : il sort TOUJOURS 0, l'assertion qui
          # porte la preuve est donc celle sur sa SORTIE, jamais celle sur son code. ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/planning-core/scripts/planning-context.sh --path "$FIX/.planning" 2>/dev/null)" || rc=$?
          echo "== 3/6 planning-context rc=$rc =="; printf '%s\n' "$out" | head -4
          [ "$rc" -eq 0 ] || note "3/6 planning-context : rc=$rc, attendu 0 (contrat fail-open)"
          case "$out" in
            *'STATE.md du workstream `dev`'*) : ;;
            *) note "3/6 planning-context : l'en-tête d'injection ne nomme pas le workstream dev — l'extrait vient de la racine" ;;
          esac

          # --- 4/6 : gate de pointeur. En mode non-hook son verdict part sur stderr : on ISOLE
          # stderr (2>&1 >/dev/null), jamais un 2>&1 global qui satisferait une assertion depuis
          # la mauvaise voie. ---
          rc=0
          err="$(GSD_WORKSTREAM=dev bash plugin/conductor/scripts/check-workstream-pointer.sh --path "$FIX" 2>&1 >/dev/null)" || rc=$?
          echo "== 4/6 check-workstream-pointer (GSD_WORKSTREAM=dev) rc=$rc =="; printf '%s\n' "$err"
          [ "$rc" -eq 0 ] || note "4/6 check-workstream-pointer : rc=$rc, attendu 0 (conforme)"
          case "$err" in
            *"canal env (GSD_WORKSTREAM)"*) : ;;
            *) note "4/6 check-workstream-pointer : le canal d'environnement n'est pas nommé dans le verdict" ;;
          esac

          # --- 5/6 : PREUVE DE DISCRIMINANCE — MÊMES fichiers, workstream NON résolu. Sans ce
          # verdict contraire, les quatre précédents seraient satisfaits par un arbre non partitionné. ---
          # TMPDIR ISOLÉ, en 5/6 comme en 6/6. Le message asserté en 6/6 nomme un canal RÉSIDUEL
          # (« pointeur de session en os.tmpdir() ») : laisser les deux verdicts partager le TMPDIR
          # de l'exécuteur, c'est laisser un pointeur de session déposé par n'importe quelle autre
          # étape décider du résultat. 5/6 ne l'isolait pas, 6/6 non plus — l'asymétrie était
          # d'autant plus trompeuse que la moitié des `env -u` y était déjà.
          mkdir -p "$FIX/tmp-isole"
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            TMPDIR="$FIX/tmp-isole" \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX" 2>/dev/null)" || rc=$?
          echo "== 5/6 check-dev-bootstrap (sans workstream) rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "5/6 check-dev-bootstrap sans workstream : rc=$rc, attendu 0 (démarrage inachevé)"
          case "$out" in
            *"[bootstrap]"*"feuille de route absente"*) : ;;
            *) note "5/6 check-dev-bootstrap sans workstream : le signal [bootstrap] « feuille de route absente » est absent — la fixture n'est PAS discriminante, le même verdict sortirait avec et sans workstream" ;;
          esac

          # --- 6/6 : PREUVE DE DISCRIMINANCE — le gate de pointeur bascule 0 → 1 sur les MÊMES
          # fichiers. Les sous-chaînes cherchées sont celles du SEUL état 4 : « GSD_WORKSTREAM » nu
          # et « ADR-064 » nu apparaissent AUSSI dans le message de conformité (« composable avec
          # ADR-064 »), ils ne discrimineraient donc rien — mesuré au banc de mutation. ---
          rc=0
          err="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            TMPDIR="$FIX/tmp-isole" \
            bash plugin/conductor/scripts/check-workstream-pointer.sh --path "$FIX" 2>&1 >/dev/null)" || rc=$?
          echo "== 6/6 check-workstream-pointer (sans workstream) rc=$rc =="; printf '%s\n' "$err"
          [ "$rc" -eq 1 ] || note "6/6 check-workstream-pointer sans workstream : rc=$rc, attendu 1 (partitionné, aucun canal composable ne résout)"
          case "$err" in
            *"export GSD_WORKSTREAM=<nom>"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : le remède (export GSD_WORKSTREAM=<nom>) est absent du message" ;;
          esac
          case "$err" in
            *"os.tmpdir()"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : le motif (pointeur de session en os.tmpdir()) est absent du message" ;;
          esac
          case "$err" in
            *"non composable avec"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : la NON-composabilité avec ADR-064 est absente du message" ;;
          esac

          rm -rf "$FIX"

          # ═══ BLOC 2 — ASSERTION DE NON-RÉGRESSION sur le CHECKOUT RACINE ════════════════════
          # CE QUE CE BLOC PROUVE, ET CE QU'IL NE PROUVE PAS. Les quatre gates sont verts PAR
          # CONSTRUCTION sur un arbre non partitionné : ce bloc ne démontre donc AUCUNE capacité —
          # il démontre seulement que l'ajout de la résolution de workstream n'a RIEN changé là où
          # il ne devait rien changer. C'est une assertion de NON-RÉGRESSION, à ne jamais confondre
          # à la relecture avec les six verdicts du bloc 1, qui sont des assertions de CAPACITÉ.
          #
          # LIMITE DE PREUVE (fait de gouvernance) : aucune exécution d'intégration continue n'a eu
          # lieu sur la branche de la Phase 23. Tant que la branche de la Phase 24 n'est pas poussée,
          # CE JOB N'AURA JAMAIS TOURNÉ POUR DE VRAI — les verdicts ci-dessous ont été rejoués à la
          # main, rien de plus.
          #
          # ÉCART MESURÉ CONTRE LA FICHE F-35 (24-CONTEXT.md), le 2026-08-04 : F-35 donne « projet
          # complètement cadré — orientation gsd-engine » comme verdict de référence du gate de
          # démarrage sur la racine. Il est aujourd'hui PÉRIMÉ — le frontmatter de .planning/STATE.md
          # fait 81 lignes, au-delà de la garde anti-gel de 60 lignes de check-dev-bootstrap.sh :
          # state3_signal échoue et le script retombe sur sa soupape de sûreté D-04, exit 3 avec un
          # stdout VIDE. Asserter la sous-chaîne de F-35 rendrait ce job rouge dès sa première
          # exécution ; asserter « stdout vide » graverait l'état dégradé comme la norme et rougirait
          # le jour où le frontmatter est raccourci. L'assertion retenue tient dans les deux cas et
          # mesure ce que ce bloc doit mesurer : l'INVARIANCE de la sortie, workstream posé ou non.
          echo "== non-régression sur le checkout racine (arbre NON partitionné) =="

          # R1 — gate de démarrage : exit 3, stdout strictement INVARIANT selon GSD_WORKSTREAM, et
          # stderr invariant HORS la ligne de repli DOCUMENTÉE de l'injecteur.
          #
          # POURQUOI STDOUT ET STDERR SONT DÉSORMAIS DISTINGUÉS, à rebours de la fusion posée le
          # 2026-08-04. À cette date le stdout de ce gate était VIDE sur la racine (soupape D-04 :
          # frontmatter de .planning/STATE.md hors garde anti-gel) — comparer deux stdout vides ne
          # pouvait RIEN opposer, d'où la fusion des deux canaux pour rester discriminant.
          # MESURÉ DEPUIS (frontmatter raccourci sous la garde) : stdout porte désormais le signal
          # métier réel (« … orientation gsd-engine », 137 octets), IDENTIQUE avec et sans
          # GSD_WORKSTREAM — la fusion n'est plus nécessaire pour rester opposable, ET elle était
          # devenue FAUSSE : elle absorbait aussi la ligne de repli de l'injecteur — LÉGITIME et
          # VOULUE par le rôle « INJECTEUR DE CONTEXTE » de workstream-policy.sh (« repli sur la
          # racine PLUS une ligne qui NOMME le workstream ») — et la faisait lire comme une fuite
          # (243 vs 356 octets, mesuré CI Linux, run 30963492481). Le contrat GSDA-13 porte sur ce
          # que la session REÇOIT (stdout) ; la ligne de repli sur stderr, elle, est le contrat
          # INVERSE (l'injecteur DOIT nommer le workstream quand il replie) et ne doit pas faire
          # rougir celui-ci. `say()` (check-dev-bootstrap.sh) préfixe TOUTES ses lignes de
          # `[check-dev-bootstrap] ` et les trois variantes de repli finissent par
          # « lecture sur la racine. » (workstream résolu-dossier-absent, compartiment refusé,
          # politique introuvable) : le motif ci-dessous couvre les trois, rien d'autre — un AUTRE
          # écart de stderr (une erreur inattendue, un message qui change de forme) reste attrapé.
          FALLBACK_RE='^\[check-dev-bootstrap\] .*lecture sur la racine\.$'
          err_sans_file="$(mktemp)"; err_avec_file="$(mktemp)"
          rc=0
          root_sans_out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path . 2>"$err_sans_file")" || rc=$?
          rc2=0
          root_avec_out="$(env -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM GSD_WORKSTREAM=dev \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path . 2>"$err_avec_file")" || rc2=$?
          root_sans_err="$(grep -Ev "$FALLBACK_RE" "$err_sans_file" || true)"
          root_avec_err="$(grep -Ev "$FALLBACK_RE" "$err_avec_file" || true)"
          rm -f "$err_sans_file" "$err_avec_file"
          echo "== R1 check-dev-bootstrap racine : rc(sans)=$rc rc(avec)=$rc2, stdout ${#root_sans_out}/${#root_avec_out} octet(s), stderr hors-repli ${#root_sans_err}/${#root_avec_err} octet(s) =="
          [ "$rc" -eq 3 ] || note "R1 check-dev-bootstrap racine sans workstream : rc=$rc, attendu 3"
          [ "$rc2" -eq 3 ] || note "R1 check-dev-bootstrap racine avec workstream : rc=$rc2, attendu 3 (un arbre non partitionné ne doit pas changer de verdict)"
          # PLANCHER D'OPPOSABILITÉ, avant le verdict : deux stdout vides ne peuvent RIEN opposer.
          # Le dire est un échec, jamais un succès — patron `NON OPPOSABLE` de
          # test-check-capability-activation.sh, qui refuse le même repli sur `cmp -s`.
          if [ -z "$root_sans_out" ] && [ -z "$root_avec_out" ]; then
            note "R1 check-dev-bootstrap racine : les DEUX stdout sont vides — l'assertion d'invariance est NON OPPOSABLE (elle comparerait deux chaînes vides et serait verte quoi qu'il arrive au sujet)"
          elif [ "$root_sans_out" != "$root_avec_out" ]; then
            note "R1 check-dev-bootstrap racine : le stdout CHANGE selon GSD_WORKSTREAM sur un arbre NON partitionné — la résolution de workstream a fui hors de son domaine"
          fi
          if [ "$root_sans_err" != "$root_avec_err" ]; then
            note "R1 check-dev-bootstrap racine : le stderr change AU-DELÀ de la ligne de repli documentée de l'injecteur — écart non attendu"
          fi

          # R2 — gate de pointeur : exit 3 ET stdout STRICTEMENT VIDE (le dépôt n'est pas
          # partitionné, il n'a rien à dire ; son diagnostic part sur stderr).
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM \
            bash plugin/conductor/scripts/check-workstream-pointer.sh --path . 2>/dev/null)" || rc=$?
          echo "== R2 check-workstream-pointer racine : rc=$rc, stdout de ${#out} octet(s) =="
          [ "$rc" -eq 3 ] || note "R2 check-workstream-pointer racine : rc=$rc, attendu 3 (silence, dépôt non partitionné)"
          [ -z "$out" ] || note "R2 check-workstream-pointer racine : stdout NON vide sur un dépôt non partitionné — le coût de la garde doit être nul là où il n'y a rien à garder"

          # R3 — injecteur de contexte : exit 0 et extrait NON VIDE.
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_CONTEXT_WORKSTREAM \
            bash plugin/planning-core/scripts/planning-context.sh --path .planning 2>/dev/null)" || rc=$?
          echo "== R3 planning-context racine : rc=$rc, $(printf '%s\n' "$out" | awk 'END{print NR}') ligne(s) =="
          [ "$rc" -eq 0 ] || note "R3 planning-context racine : rc=$rc, attendu 0"
          [ -n "$out" ] || note "R3 planning-context racine : extrait VIDE — l'injection de contexte ne produit plus rien"

          # ═══ BILAN UNIQUE — aucun `|| true` sur une invocation de gate, aucun écart toléré ═══
          echo "== BILAN : $fail écart(s) sur 6 verdicts partitionnés + 3 verdicts racine =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== gates workstream VERTS : la partition est vue, elle est discriminante, et la racine n'a pas bougé =="

      - name: check-release-tag (main uniquement — VERSION doit être taggée et poussée)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # GH_TOKEN requis : sans lui le gh du runner échoue en auth et le gate lisait cet
        # échec comme « aucune release » (faux négatif, vécu v2.39.0 le 2026-07-26).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-tag.sh --remote

  lab-frais:
    name: Lab frais (install baseline + Gate C — leçon UAT 2026-07-25, F2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la baseline dans un lab vierge avec le vrai engine
        run: |
          set -eu
          LAB="$(mktemp -d)"
          echo "LAB=$LAB" >> "$GITHUB_ENV"
          cd "$LAB" && git init -q
          # fermeture transitive de conductor = la baseline mandatory réelle
          closure=$(cd "$GITHUB_WORKSPACE" && bash plugin/_internal/resolve-deps.sh conductor)
          echo "== baseline : $closure =="
          for m in $closure; do
            VIBEFLOW_CACHE="$GITHUB_WORKSPACE/plugin" VF_SCOPE=project \
              bash "$GITHUB_WORKSPACE/plugin/_internal/vibeflow-update.sh" install "$m"
          done

      - name: "Gate C du lab frais : la baseline doit passer ses propres gates SANS intervention"
        run: |
          set -eu
          cd "$LAB"
          echo "== check-agents --strict sur les agents installés =="
          bash .claude/scripts/check-agents.sh --strict
          echo "== check-registres --strict (registres canoniques posés ?) =="
          # tolérance : un lab tout juste installé n'a pas encore de .planning ; le gate
          # doit rendre un verdict propre (0 ou 3+message), jamais un crash
          bash .claude/scripts/check-registres.sh --strict --allow-empty || rc=$?; rc=${rc:-0}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "::error::check-registres rc=$rc inattendu"; exit 1; fi
          echo "== hooks de gouvernance présents dans settings.json =="
          grep -q "guard" .claude/settings.json

  # POURQUOI CE JOB EXISTE (Phase 28, ARMD-06/ARMD-08 — as-installed testing, #38). Le job
  # ci-dessus (lab-frais) installe la fermeture de `conductor` (7 modules) : elle ne pose NI le
  # gate `check-capability-activation.sh` NI un seul artefact arme — un gate exerce seulement sur
  # l'arbre source (la suite du module) ne peut donc RIEN prouver sur ce que l'install pose CHEZ
  # L'UTILISATEUR. C'est la faille de fond de #38 : « il verifie que l'install tient, jamais que ce
  # qu'elle pose est coherent avec ce qu'elle a promis » (.planning/ROADMAP.md:2047-2049). Ce job
  # installe donc sa PROPRE fermeture, `dev-orchestrator` (9 modules, la seule fermeture mesuree qui
  # pose a la fois le gate et des artefacts armes), dans son PROPRE lab, sans toucher a une seule
  # ligne de `lab-frais` ni de son Gate C.
  lab-frais-arme:
    name: Lab frais arme (as-installed testing — le gate installe, sur un univers non vide, #38)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (bash, jq, python3)
        # Ni `gates` ni `lab-frais` n'assertent cet outillage aujourd'hui ; leur présence sur
        # ubuntu-latest est une DÉDUCTION tirée du vert actuel, pas une mesure. Un gate qui sort 2
        # pour outil manquant doit le dire par un message d'assertion, jamais par un diagnostic
        # trompeur venu d'ailleurs.
        run: |
          bash --version | head -1
          jq --version
          python3 --version

      - name: "Installer la fermeture dev-orchestrator (9 modules) dans un lab armé, distinct de $LAB"
        run: |
          set -eu
          LAB_ARME="$(mktemp -d)"
          echo "LAB_ARME=$LAB_ARME" >> "$GITHUB_ENV"
          cd "$LAB_ARME" && git init -q
          closure=$(cd "$GITHUB_WORKSPACE" && bash plugin/_internal/resolve-deps.sh dev-orchestrator)
          echo "== fermeture armée : $closure =="
          # Échec VISIBLE si la fermeture a dérivé et ne contient plus dev-orchestrator : sans cette
          # assertion (awk, jamais grep pipé — le grep de ce poste tronque silencieusement), ce job
          # rendrait vert à vide, exactement le mode d'échec que la phase existe pour fermer.
          if ! printf '%s\n' "$closure" | awk '$0=="dev-orchestrator"{f=1} END{exit !f}'; then
            echo "::error::fermeture résolue sans dev-orchestrator — le gate ne serait pas installé, ce job rendrait vert à vide"
            exit 1
          fi
          for m in $closure; do
            VIBEFLOW_CACHE="$GITHUB_WORKSPACE/plugin" VF_SCOPE=project \
              bash "$GITHUB_WORKSPACE/plugin/_internal/vibeflow-update.sh" install "$m"
          done

      - name: "Doter le lab armé d'une configuration minimale (plafond : trois clés)"
        # Mesuré (Phase 28, plan 03) : un lab installé avec cette fermeture et un
        # .planning/config.json VIDE sort en ÉCART règle 2 sur intel.enabled (toggle INACTIF cité
        # hors marqueur conditionnel dans docs-flow.md) — une règle ÉTRANGÈRE au périmètre de cette
        # phase. Le corpus, l'index et la règle ne sont PAS touchés : seule la clé strictement
        # nécessaire est posée ici. Une seule clé a suffi à la mesure, bien sous le plafond de trois.
        run: |
          set -eu
          mkdir -p "$LAB_ARME/.planning"
          cat > "$LAB_ARME/.planning/config.json" <<'JSON'
          {
            "intel": { "enabled": true }
          }
          JSON

      - name: "Invoquer le gate INSTALLÉ, sans surcharge — un exit 2 échoue comme un exit 1"
        # Aucune surcharge VF_CAPACT_* : la cascade de résolution est exercée telle qu'elle tourne
        # chez l'utilisateur, exactement comme le fait l'invocation nue du job `gates`. Ne JAMAIS
        # invoquer le script depuis $GITHUB_WORKSPACE : tester l'arbre source contre un lab est le
        # geste que le pattern *as-installed testing* condamne, et c'est la confusion qui a produit
        # #38.
        run: |
          set -eu
          cd "$LAB_ARME"
          rc=0
          bash .claude/scripts/check-capability-activation.sh || rc=$?
          echo "== gate installé (rc=$rc) =="
          # Un exit 2 (NON VÉRIFIABLE) échoue le job au même titre qu'un exit 1 — un gate qui ne peut
          # pas se prononcer n'est pas un gate vert.
          [ "$rc" -eq 0 ]

      - name: "Plancher d'opposabilité du job : au moins deux artefacts armés installés"
        # Deux et non un : avec un seul, un futur changement de fermeture viderait l'ensemble sans
        # que ce job ne le distingue d'un vert légitime. État mesuré (Phase 28) : vf-coder.md et
        # vf-reviewer.md, tous deux posés par dev-orchestrator, tous deux porteurs de
        # `vf-requires: mcp-servers` depuis 28-02 ; les trois agents de mobile-test-team restent hors
        # champ, ce module n'appartenant à aucune fermeture mesurée. Compte en awk, jamais en grep
        # pipé (le grep de ce poste tronque silencieusement).
        run: |
          set -eu
          cd "$LAB_ARME"
          armed_count=$(awk '
            FNR==1 { fm=0 }
            $0=="---" { fm++; next }
            fm==1 && ($0 ~ /^isolation:[ \t]*[^ \t]/ || $0 ~ /^vf-mcp-consumer:[ \t]*[^ \t]/ || $0 ~ /^vf-mcp-tools:[ \t]*[^ \t]/) { print FILENAME }
          ' .claude/agents/*.md 2>/dev/null | sort -u | awk 'END{print NR+0}')
          echo "== artefacts armés installés : $armed_count =="
          if [ "$armed_count" -lt 2 ]; then
            echo "::error::univers d'armement du lab installé < 2 ($armed_count) — le job refuse de rendre un verdict sur un univers vide"
            exit 1
          fi
