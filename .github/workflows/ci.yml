# CI vibeflow-os — le repo se soumet enfin à ses propres gates (audit 2026-07-25 : F13/F14/P1-b).
#
# Principe (contrat de découverte, F13) : chaque job ASSERTE que sa découverte est non vide
# avant de rendre un verdict — 0 suite trouvée ou 0 dossier d'agents trouvé = échec, jamais
# un vert par absence de cible (« vacuous green »).
#
# check-release-tag ne tourne que sur main : une branche de feature porte légitimement une
# VERSION dont le tag n'existe pas encore (le tag est posé après merge, cf. CLAUDE.md).
#
# `traffic-data` est exclue de push : cette branche ne porte que de la donnée (traffic.json),
# aucun gate n'a de cible à y trouver, et surtout chaque job qu'on y déclencherait ferait un
# `actions/checkout`, donc un clone de plus — la sonde polluerait précisément la mesure qu'elle
# produit (scripts/traffic-snapshot.sh).
name: CI

on:
  push:
    branches: ["**", "!traffic-data"]
  pull_request:

jobs:
  tests:
    name: Suites de tests (découverte non vide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (bash, jq, python3)
        run: |
          bash --version | head -1
          jq --version
          python3 --version

      # Node 24+ depuis gsd-core 1.11.0 — et ce pin décide QUELLE VERSION DU MOTEUR la CI teste.
      # `engines` de 1.11.0 exige node >=24 (1.10.0 se contentait de >=22) : sous Node 22, la
      # commande d'install ci-dessous ne casse PAS, elle RÉTROGRADE silencieusement en 1.10.0. La CI
      # mesurait alors un moteur que plus personne n'installe, et T28-F (fraîcheur de
      # references/gsd-capabilities-index.md) rougissait structurellement — la copie versionnée est
      # régénérée contre le moteur réellement distribué (1.11.0), pas contre le repli.
      # Mesuré le 2026-08-27 en conteneur : node:22-slim → 1.10.0 → index divergent ;
      # node:24-slim → 1.11.0 → index identique. Épinglé plutôt que subi depuis l'image du runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer le moteur GSD (@opengsd/gsd-core@^1) — sans lui, deux cas ne peuvent rien prouver
        run: |
          set -eu
          # POURQUOI (arbitrage A-7, Phase 23). Les cas 20 et 26 de
          # plugin/dev-orchestrator/scripts/tests/test-check-gsd-config.sh tournent contre le moteur
          # RÉELLEMENT INSTALLÉ — c'est leur raison d'être : compteur d'ATTEINTE (20) et détection de
          # dérive du mirroir engineExtra (26). Sur un runner sans moteur ils sortent en `ko`, et ils
          # sortent en `ko` À BON DROIT. Ils ne doivent JAMAIS être dégradés en `skip`, en `ok`
          # conditionnel, ni être entourés d'un `|| true` : ce serait rouvrir le « vert à vide » qu'ils
          # existent pour fermer. La cause se traite ICI, dans l'environnement d'exécution.
          #
          # OÙ (cascade de check-gsd-config.sh — DEUX branches, premier trouvé gagne) :
          #   1. <repo>/.claude/gsd-core/bin/lib             — ÉCARTÉE : ce dépôt ignore .claude/
          #      délibérément (« le repo est la SOURCE des modules, PAS un lab », .gitignore) ;
          #      y déposer le distribuable contredirait cette règle et déplacerait le GSD_HOME dérivé
          #      par check-gsd-engine.sh / ensure-deps.sh.
          #   2. $HOME/.claude/gsd-core/bin/lib               — CELLE-CI : c'est ce que pose
          #      l'installeur officiel en scope global, et c'est la topologie d'un poste de dev réel.
          #
          # Une TROISIÈME branche existait, <repo>/node_modules/@opengsd/gsd-core/bin/lib, et elle a
          # été RETIRÉE du script (arbitrage A-10). C'est ce job qui l'avait mesurée morte : le
          # paquet publié dépose son payload sous .../@opengsd/gsd-core/gsd-core/bin/lib — DOUBLE
          # SEGMENT. Un bin/lib existe bien un cran plus haut, mais il ne contient que
          # ui-safety-gate.cjs, pas config.cjs : le `[ -f "$candidate/config.cjs" ]` de la cascade
          # n'y a jamais réussi, sur aucune version (défaut identique 1.8.0 / 1.9.0). Ne pas la
          # rétablir « au cas où » : elle ouvrirait une voie de résolution neuve pour un moteur non
          # maîtrisé, au moment précis où l'on ferme un vecteur d'exécution de code.
          #
          # COMMENT : la commande du dépôt lui-même (ensure-deps.sh), plafond "^1" — dernier 1.x, mais
          # un saut de MAJEURE reste une décision humaine (arbitrage 2026-07-26, audit Phase 11).
          npx -y "@opengsd/gsd-core@^1" --claude --global

          # Échec VISIBLE : l'installeur peut sortir 0 sans avoir posé le payload attendu (changement
          # de layout amont, install partielle). Sans cette assertion, les cas 20/26 repartiraient en
          # `ko` en accusant la suite alors que la panne est ici.
          LIB="$HOME/.claude/gsd-core/bin/lib"
          for f in config.cjs config-loader.cjs capability-registry.cjs configuration.cjs; do
            if [ ! -f "$LIB/$f" ]; then
              echo "::error::moteur GSD absent après install : $LIB/$f introuvable — les cas 20 et 26 de test-check-gsd-config.sh ne pourraient rien prouver"
              exit 1
            fi
          done
          echo "== moteur GSD $(cat "$HOME/.claude/gsd-core/VERSION" 2>/dev/null || echo '?') résolu par la branche 3 de la cascade : $LIB =="

      # ------------------------------------------------------------------------------------------
      # CANARI DE FORME DU MOTEUR GSD (arbitrage A-9, voie c d'O-13)
      #
      # POURQUOI ICI ET PAS DANS UNE SUITE. Les scripts qui couplent ce dépôt au moteur GSD ne
      # l'exécutent plus, ils le LISENT (arbitrage A-6). Le prix de cette mesure est qu'une lecture
      # de texte ne suit AUCUNE indirection : le jour où le moteur déplace un manifeste, écrit
      # `new Set(VARIABLE)` ou calcule ses défauts, l'extraction rend zéro. Le script le DIT
      # désormais (signal « moteur périmé »), mais il le dit sur le poste de l'utilisateur, au
      # SessionStart, sous le `|| true` du hook — c'est-à-dire au pire endroit possible. Ce canari
      # déplace la détection ICI : il rougit à la première montée de version qui casse la forme
      # lisible, avant que quiconque ne le découvre en session.
      #
      # CE QU'IL MESURE, ET POURQUOI IL NE PEUT PAS ÊTRE VERT À VIDE. Trois discriminants dans UN
      # SEUL fichier audité, un par source de clés connues — un jeu de clés vide échouerait sur le
      # premier, un jeu universel sur le second :
      #   1. `bloc_canari_inexistant` DOIT être signalé  → source 1 (VALID_CONFIG_KEYS) lue, et
      #      discriminante : elle ne reconnaît pas n'importe quoi ;
      #   2. `workflow.ui_review`, ÉCRIT dans le fichier, ne doit PAS être signalé inconnu →
      #      source 2 (configKeys du registre) lue : c'est la SEULE source où cette clé existe ;
      #   3. au moins 3 toggles rendus « au défaut amont (valeur) » → source 3 (CONFIG_DEFAULTS)
      #      lue AVEC ses valeurs. C'est le mode d'échec le plus vicieux : des défauts calculés
      #      laissent le gate parler tout en affirmant des absences fausses.
      #   4. AUCUN signal « moteur périmé » — la garde générale, qui couvre les trois sources.
      #
      # SECOND SCRIPT DU MODULE — IMPLÉMENTÉ (Phase 23, plan 23-04b, arbitrage A-12). Le point
      # d'extension annoncé ici a été tenu : build-gsd-capabilities-index.sh a basculé lui aussi en
      # lecture de texte (require(registryPath) fermait T-23-04-07, une RCE de même vecteur que
      # celle fermée sur check-gsd-config.sh) et sa sonde vit plus bas, DANS CETTE MÊME ÉTAPE, sous
      # le même `set -eu` et le même bilan `fail`/`note` — toujours pas de second job, pas de `|| true`.
      - name: Canari de forme du moteur GSD (lecture de texte — check-gsd-config.sh)
        run: |
          set -eu
          LAB="$(mktemp -d)"
          mkdir -p "$LAB/.planning"
          cat > "$LAB/.planning/config.json" <<'JSON'
          { "bloc_canari_inexistant": { "x": 1 },
            "workflow": { "ui_review": false } }
          JSON

          # La cascade du script est laissée faire (branche $HOME, posée à l'étape précédente) : le
          # canari doit mesurer le chemin RÉEL, pas une surcharge d'environnement.
          out="$(env -u VF_CONFIG_PATH -u VF_GSD_CORE_LIB bash plugin/dev-orchestrator/scripts/check-gsd-config.sh --path "$LAB" 2>/dev/null)" || rc=$?
          rc="${rc:-0}"
          rm -rf "$LAB"
          echo "== sortie du gate (rc=$rc) =="
          printf '%s\n' "$out"

          fail=0
          note() { echo "::error::canari de forme du moteur GSD : $1"; fail=$((fail + 1)); }

          case "$rc" in 0|3|64) : ;; *) note "rc=$rc HORS du contrat de sortie {0, 3, 64}" ;; esac

          case "$out" in
            *"une source de clés connues n'a rien rendu"*)
              note "le gate se déclare PÉRIMÉ sur le moteur installé — la forme du moteur a changé et la lecture de texte ne la suit plus. Corriger l'extraction dans check-gsd-config.sh ; ne PAS neutraliser ce canari." ;;
          esac

          case "$out" in
            *bloc_canari_inexistant*) : ;;
            *) note "source 1 (VALID_CONFIG_KEYS) : un bloc de premier niveau qui n'existe dans AUCUNE version du moteur n'est pas signalé — les clés connues ne sont plus lues, ou l'ensemble lu est devenu universel" ;;
          esac

          # La clé est cherchée SUR la ligne des sous-clés inconnues, jamais dans tout le blob : une
          # co-présence (« inconnues » ici, « ui_review » trois lignes plus bas) ferait rougir le
          # canari pour la mauvaise raison.
          sub_line="$(printf '%s\n' "$out" | awk '/sous-clés inconnues/ { print }')"
          case "$sub_line" in
            *ui_review*)
              note "source 2 (configKeys du registre de capabilities) : workflow.ui_review est signalé inconnu alors qu'il est ÉCRIT et légitime — c'est la seule source où cette clé existe, elle n'est donc plus lue" ;;
          esac

          n_def="$(printf '%s\n' "$out" | awk '/au défaut amont \(/ { n++ } END { print n+0 }')"
          echo "== toggles rendus avec leur défaut amont : $n_def =="
          if [ "$n_def" -lt 3 ]; then
            note "source 3 (CONFIG_DEFAULTS) : seulement $n_def toggle(s) rendu(s) avec une valeur de défaut lue (plancher 3). Des défauts devenus calculés font AFFIRMER au gate des absences fausses."
          fi

          # ----------------------------------------------------------------------------------------
          # CANARI DE FORME DU MOTEUR GSD — GÉNÉRATEUR (arbitrage A-12, T-23-04-07). Même principe :
          # build-gsd-capabilities-index.sh ne require() plus le registre de capabilities, il le LIT
          # (le vecteur qu'il fermait — un capability-registry.cjs piégé résolu depuis le dépôt audité
          # exécuté par require() — est le MÊME que celui fermé par check-gsd-config.sh sous A-6). Le
          # prix est le même aussi : une lecture de texte ne suit aucune indirection, donc le jour où
          # le moteur déplace ou calcule `byLoopPoint`, l'extraction échoue. Le générateur le DIT
          # (« EXTRACTION PERIMEE », rc=1) au lieu de produire un index tronqué ou périmé en silence.
          #
          # CE QU'IL MESURE, ET POURQUOI IL NE PEUT PAS ÊTRE VERT À VIDE :
          #   1. le générateur tourne contre le moteur RÉELLEMENT installé (posé à l'étape
          #      précédente) et DOIT réussir (rc=0), sans jamais afficher le signal périmé — sinon la
          #      forme de `byLoopPoint` a changé et la lecture de texte ne la suit plus ;
          #   2. la table produite nomme un point de hook réellement déclaré par CE moteur
          #      (`plan:pre`, présent sur toute version connue) — sans ce plancher, un générateur qui
          #      ne lirait plus rien satisferait « rc=0 » sur une table vide.
          # Sortie dans un TEMPORAIRE, jamais dans references/gsd-capabilities-index.md : ce canari
          # mesure la LISIBILITÉ du moteur, il ne doit pas modifier le fichier versionné du checkout.
          gen_out="$(mktemp)"
          gen_index="$(mktemp)"
          gen_rc=0
          VF_GSD_CORE_LIB="$HOME/.claude/gsd-core/bin/lib" VF_CAPS_INDEX_OUT="$gen_index" \
            bash plugin/dev-orchestrator/scripts/build-gsd-capabilities-index.sh \
            > /dev/null 2>"$gen_out" || gen_rc=$?
          echo "== sortie du générateur (rc=$gen_rc) =="
          cat "$gen_out"

          case "$gen_rc" in 0|1) : ;; *) note "générateur : rc=$gen_rc HORS du contrat de sortie {0, 1}" ;; esac
          if [ "$gen_rc" -ne 0 ]; then
            note "générateur : n'a PAS réussi contre le moteur installé (rc=$gen_rc) — voir la sortie ci-dessus"
          fi
          case "$(cat "$gen_out")" in
            *"EXTRACTION PERIMEE"*)
              note "générateur : se déclare PÉRIMÉ sur le moteur installé — la forme de byLoopPoint a changé et la lecture de texte ne la suit plus. Corriger l'extraction dans build-gsd-capabilities-index.sh ; ne PAS neutraliser ce canari." ;;
          esac
          if grep -qF 'plan:pre' "$gen_index" 2>/dev/null; then
            :
          else
            note "générateur : le point de hook plan:pre (présent sur toute version connue du moteur) n'apparaît pas dans l'index régénéré — la table produite est vide ou n'a pas été régénérée"
          fi
          rm -f "$gen_out" "$gen_index"

          if [ "$fail" -ne 0 ]; then
            echo "== canari ROUGE : $fail écart(s) entre la forme attendue du moteur et la forme lisible =="
            exit 1
          fi
          echo "== canari VERT : les trois sources du moteur installé restent lisibles par extraction de texte, ET le registre de capabilities reste lisible par le générateur =="

      - name: Découvrir et lancer toutes les suites
        run: |
          set -u
          suites=$(find plugin scripts -type f -path '*/tests/test-*.sh' | sort)
          count=$(printf '%s\n' "$suites" | grep -c . || true)
          echo "== $count suite(s) découverte(s) =="
          # Assertion de découverte non vide (F13) : 0 suite = échec, pas un vert.
          if [ "$count" -eq 0 ]; then
            echo "::error::aucune suite de tests découverte (pattern */tests/test-*.sh) — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          fail=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              rc=$?
              echo "::error::FAIL(rc=$rc) $t"
              fail=$((fail + 1))
            fi
            echo "::endgroup::"
          done <<EOF
          $suites
          EOF
          echo "== bilan : $count suite(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

  gates:
    name: Gates de qualité (mode strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique + tags complets (check-release-tag)

      - name: check-agents --strict sur chaque plugin/*/agents (découverte non vide)
        run: |
          set -u
          found=0
          fail=0
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            found=$((found + 1))
            echo "== $d =="
            # --strict : skills déclarés doivent exister + cible vide → exit 3 (INDÉTERMINÉ ≠ vert)
            bash plugin/conductor/scripts/check-agents.sh --strict --agents-dir="$d" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun dossier plugin/*/agents découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found dossier(s) d'agents vérifié(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-agents --strict sur chaque plugin/*/AGENT.md (module mono-agent)
        # POURQUOI CETTE ÉTAPE EXISTE : le balayage ci-dessus ne voit QUE `plugin/*/agents/`, alors
        # que l'installeur pose DEUX familles d'agents dans `.claude/agents/` — `agents/<nom>.md`
        # (Type 3b) ET `AGENT.md` à la racine du module (Type 3, `vibeflow-update.sh` : `cp
        # "$module_dir/AGENT.md" "$TARGET_ROOT/agents/${mod}.md"`). La population réelle est de 31
        # fichiers, pas 25. Un durcissement de check-agents.sh (l'exigence de `effort:`) appliqué
        # aux seuls 25 a donc laissé passer 5 modules non conformes jusqu'au Gate C du lab frais,
        # qui les découvre trop tard et sous `set -eu`. Le gate par module doit voir la MÊME
        # population que l'install, sinon il rend un vert sur un sous-ensemble.
        run: |
          set -u
          found=0
          fail=0
          # `--file <path>` en DEUX arguments : la forme `--file=<path>` n'est PAS reconnue par
          # check-agents.sh (seul `--agents-dir=` accepte le `=`), elle dégrade en cible vide —
          # et sans `--strict`, une cible vide rend 0. `--strict` est donc le garde-fou qui
          # transforme ce vert-à-vide en exit 3 audible : ne pas le retirer d'ici.
          for f in plugin/*/AGENT.md; do
            [ -f "$f" ] || continue
            found=$((found + 1))
            echo "== $f =="
            bash plugin/conductor/scripts/check-agents.sh --strict --file "$f" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun plugin/*/AGENT.md découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found AGENT.md vérifié(s), $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-agents --resolve-agents=strict (monde fermé — union de tous les plugin/*/agents)
        # Le monde fermé n'est légitime qu'ici : la CI est le seul endroit où l'univers complet des
        # agents du repo est connu (cf. en-tête check-agents.sh). Chaque run par module ci-dessus
        # reste en lenient par défaut (ne pas durcir : c'est ce qui évite de rejouer les 66 faux
        # positifs tracés dans .planning/codebase/CONCERNS.md:52-59) — cette étape est un run
        # SUPPLÉMENTAIRE, indépendant du run lenient au-dessus.
        run: |
          set -u
          registry_args=()
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            registry_args+=("--agent-registry-dir=$d")
          done
          found=0
          fail=0
          for d in plugin/*/agents; do
            [ -d "$d" ] || continue
            found=$((found + 1))
            echo "== monde fermé : $d =="
            bash plugin/conductor/scripts/check-agents.sh --strict --resolve-agents=strict --agents-dir="$d" "${registry_args[@]}" || fail=$((fail + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::aucun dossier plugin/*/agents découvert — la CI refuse de rendre un verdict vide"
            exit 1
          fi
          echo "== $found dossier(s) vérifiés en monde fermé, $fail échec(s) =="
          [ "$fail" -eq 0 ]

      - name: check-blueprints (le frontmatter cible passe le gate qu'il vise)
        # POURQUOI CETTE ÉTAPE EXISTE : un blueprint publie un « frontmatter cible » que vf-new-lab
        # recopie dans l'agent instancié — et ce frontmatter n'était soumis à AUCUN gate. Mesuré le
        # 2026-09-22 : les 9 blueprints omettaient tous `effort:`, bloquant depuis la Phase 24. Un
        # lab fabriqué depuis l'un d'eux voyait donc son Write REFUSÉ par guard-agent-write.sh : la
        # fabrique et son contrôleur avaient divergé sans qu'aucun témoin ne le voie.
        # PAS de --strict ici, et c'est délibéré : les skills déclarés par un blueprint sont créés
        # DANS LE LAB à l'instanciation, pas présents dans le plugin. Les exiger ici rendrait le
        # gate faux par construction — il refuserait des blueprints corrects.
        run: bash plugin/conductor/scripts/check-blueprints.sh

      - name: check-version-sync (canon VERSION ↔ plugin.json ↔ marketplace ↔ badges ↔ triade par module)
        run: bash scripts/check-version-sync.sh

      - name: check-state-integrity (anti-régression du frontmatter .planning/STATE.md, ADR-063)
        # FAN-OUT PAR COMPARTIMENT (Phase 41.1, plan 41.1-06, WSAW-02/03/04/05). Cette étape
        # invoquait `check-state-integrity.sh` UNE SEULE FOIS, sur un chemin littéral
        # `.planning/workstreams/fiabilite/` (le compteur de la recette de ce plan exige ZÉRO occurrence
        # du littéral complet, prose comprise) : tout compartiment ajouté restait invisible du
        # gate, sans qu'aucun signal ne le dise. Elle ÉNUMÈRE désormais les compartiments présents
        # via `vf_ws_enumerate` (plan 41.1-01) et invoque le gate UNE FOIS PAR COMPARTIMENT. Le
        # script lui-même est INCHANGÉ (a2, single-target par conception, D-04) — c'est l'APPELANT
        # qui devient a1 par fan-out.
        #
        # NOM DE L'ÉTAPE INCHANGÉ, DÉLIBÉRÉMENT : l'amendement du 2026-09-23 d'ADR-069
        # (`docs/ADR.md`) désigne cette étape PAR SON NOM, précisément pour survivre à la réécriture
        # que fait ce plan. Le renommer rendrait cet amendement faux. Ne pas le renommer.
        #
        # `--file` reste EXPLICITE, en défense en profondeur : sans lui, le fichier vérifié dépend
        # de l'environnement (GSD_WORKSTREAM, pointeur in-repo) et un simple `export` suffirait à
        # détourner le gate vers un autre STATE.md — ou à le désarmer. Le script fait primer
        # `--file` sur toute résolution de workstream (FILE_REL_EXPLICIT) : c'est précisément le
        # remède, il suffit que la CI l'utilise. `--path` et `--file` sont TOUJOURS passés ENSEMBLE,
        # `--file` RELATIF à `--path` — un `--file` absolu est rejeté en 64 depuis le plan 41.1-09,
        # après avoir été un fail-open silencieux (l'Invariant 1 sauté sans un mot).
        run: |
          set -eu
          . plugin/planning-core/scripts/workstream-policy.sh

          # Classification D-02 INCONDITIONNELLE, par lecture directe du frontmatter — jamais une
          # dépendance de forme sur un libellé que `check-state-integrity.sh` n'émet pas (a2, D-04 ;
          # mesuré : ce script n'émet JAMAIS la sous-chaîne « non initialis »). Variables locales et
          # préfixées `_ini_` : `f`/`fm`/`keys`/`nkeys` en globales écraseraient les compteurs d'une
          # étape appelante sans un mot.
          is_non_init() { # <fichier STATE.md> -> rc 0 = non-initialisé, rc 1 = pas ce cas
            local _ini_f="$1" _ini_fm _ini_keys _ini_nkeys
            [ -r "$_ini_f" ] || return 1
            _ini_fm="$(awk '/^---[[:space:]]*$/{n++; if(n==1) next; if(n==2) exit} {print}' "$_ini_f")"
            _ini_keys="$(printf '%s\n' "$_ini_fm" | awk -F: 'NF>=2{gsub(/^[[:space:]]+|[[:space:]]+$/,"",$1); print $1}' | sort -u | awk 'NF')"
            _ini_nkeys="$(printf '%s\n' "$_ini_keys" | wc -l | tr -d ' ')"
            [ "$_ini_nkeys" -eq 2 ] || return 1
            printf '%s\n' "$_ini_keys" | grep -qx 'workstream' || return 1
            printf '%s\n' "$_ini_keys" | grep -qx 'created' || return 1
            return 0
          }

          # D-02 AMENDÉE le 2026-09-23 (arbitrage Samuel, AskUserQuestion session principale, Q1
          # option b) : « non initialisé » porte sur le FRONTMATTER SEUL. La clause « ET aucun
          # ROADMAP/REQUIREMENTS de contenu » est RETIRÉE — elle classait `gouvernance` CORROMPU
          # (STATE.md à 2 clés MAIS ROADMAP.md de 180 lignes, REQUIREMENTS.md, phases/), contre le
          # critère tranché « un compartiment neuf ne doit jamais rougir ». Ce que `is_non_init`
          # laisse passer EN SILENCE est le cas INVERSE — un STATE.md TRONQUÉ jusqu'aux 2 clés
          # nominales avec du contenu bien rempli à côté. Les deux ont la MÊME SIGNATURE SUR DISQUE.
          # D'où le VERDICT NOMMÉ D'AMBIGUÏTÉ plus bas : une NOTICE qui nomme les DEUX lectures et
          # n'en choisit AUCUNE. (Discriminer par l'historique git a été explicitement écarté : cela
          # ferait dépendre le verdict d'un passé que rien ne garantit présent.)
          ws_has_content() { # <dossier compartiment> -> rc 0 = du contenu existe à côté du STATE.md
            local _wsc_d="$1"
            if [ -s "$_wsc_d/ROADMAP.md" ]; then return 0; fi
            if [ -s "$_wsc_d/REQUIREMENTS.md" ]; then return 0; fi
            if [ -d "$_wsc_d/phases" ] && [ -n "$(ls -A "$_wsc_d/phases" 2>/dev/null || true)" ]; then return 0; fi
            return 1
          }
          # NOTE : un compartiment SANS STATE.md du tout (`[ -r ... ]` faux) n'est PAS classé
          # non-init — il tombe au script, qui rougira. C'EST VOULU : l'absence totale de STATE.md
          # n'est ni la facture nominale de `workstream create` (qui en écrit TOUJOURS un) ni un
          # état sain — c'est corrompu par construction, et l'échec audible est la posture
          # fail-closed cohérente avec le reste de cette étape.

          # Toutes les variables/fonctions internes sont locales et préfixées `_fsi_` : appelée
          # depuis une étape qui tient ses propres compteurs `fail`/`note`, cette fonction ne doit
          # JAMAIS pouvoir en effacer un (défaut déjà introduit puis fermé dans ce dépôt).
          fanout_check_state_integrity() { # <lab_root> -> bilan sur stdout, rc 0 = 0 écart, 1 = >=1
            local lab_root="$1" lab_root_abs planning_dir
            local _fsi_fail=0 _fsi_n=0 _fsi_rc=0 _fsi_wsdir _fsi_rel _fsi_statefile_rel _fsi_out _fsi_rc2 _fsi_ws_list
            lab_root_abs="$(cd "$lab_root" && pwd)"
            planning_dir="$lab_root_abs/.planning"
            _fsi_note() { echo "::error::check-state-integrity : $1"; _fsi_fail=$((_fsi_fail + 1)); }
            _fsi_ws_list="$(vf_ws_enumerate "$planning_dir")" || _fsi_rc=$?
            # rc=3 EST NOMINAL, JAMAIS UN ÉCART : le plan 41.1-01, PRODUCTEUR de la primitive,
            # déclare « 3 = SILENCE, workstreams/ absent (dépôt non partitionné, ÉTAT NOMINAL) ».
            # Le traiter comme un 2 ferait rougir la CI sur l'état que son propre producteur déclare
            # nominal — masqué sur CE dépôt (partitionné), mais la fixture voisine du MÊME job
            # construit des arbres NON partitionnés (BLOC 2a « non-régression FLAT »).
            case "$_fsi_rc" in
              0) : ;;
              3)
                echo "::notice::$planning_dir : aucun compartiment de workstream (workstreams/ absent) — dépôt NON PARTITIONNÉ, état NOMINAL. Rien à mesurer, AUCUN écart."
                return 0
                ;;
              2)
                echo "::error::vf_ws_enumerate $planning_dir : workstreams/ présent mais AUCUN compartiment vérifiable (lien symbolique, illisible, ou vide après filtrage anti-lien) — NON VÉRIFIABLE, jamais un vert par défaut"
                return 1
                ;;
              *)
                echo "::error::vf_ws_enumerate $planning_dir : code de sortie imprévu ($_fsi_rc, attendu 0/2/3) — NON VÉRIFIABLE"
                return 1
                ;;
            esac
            while IFS= read -r _fsi_wsdir; do
              [ -n "$_fsi_wsdir" ] || continue
              _fsi_n=$((_fsi_n + 1))
              _fsi_rel="${_fsi_wsdir#"$lab_root_abs"/}"
              _fsi_statefile_rel="$_fsi_rel/STATE.md"
              if is_non_init "$_fsi_wsdir/STATE.md"; then
                echo "::notice::$_fsi_rel : non initialisé (D-02 amendée, frontmatter réduit à workstream:+created:), jamais compté comme écart (D-06)"
                if ws_has_content "$_fsi_wsdir"; then
                  echo "::notice::$_fsi_rel : AMBIGUITE-D02 — frontmatter nominal MAIS du contenu existe à côté (ROADMAP.md / REQUIREMENTS.md / phases/). DEUX lectures sont possibles et AUCUNE n'est choisie ici : (i) compartiment NEUF alimenté par carve-out ; (ii) compartiment TRAVAILLÉ dont le STATE.md a été TRONQUÉ en plein cycle d'écriture. Les deux ont la même signature sur disque. Ceci est une NOTICE, PAS un échec — à lever à la main."
                fi
                continue
              fi
              _fsi_rc2=0
              _fsi_out="$(bash plugin/conductor/scripts/check-state-integrity.sh --path "$lab_root_abs" --file "$_fsi_statefile_rel" 2>&1)" || _fsi_rc2=$?
              echo "== check-state-integrity $_fsi_rel : rc=$_fsi_rc2 =="; printf '%s\n' "$_fsi_out"
              case "$_fsi_rc2" in
                0) : ;;
                3)
                  # CONSOMMATION DU SIGNAL produit par le plan 41.1-09 (d'où le depends_on).
                  # 3 = conforme SOUS RÉSERVE : l'Invariant 1 (non-régression des compteurs,
                  # ADR-063) a été SAUTÉ faute de baseline à HEAD. Ce N'EST PAS un écart — le faire
                  # échouer rougirait sur TOUT compartiment neuf et casserait l'invariant à trois
                  # états de D-02. Ce qui change : ne juger QUE le code de sortie laissait
                  # l'annonce du gate sur stderr SEULEMENT, donc INVISIBLE AU VERDICT.
                  echo "::notice::$_fsi_rel : INVARIANT1-SAUTE — conforme SOUS RÉSERVE, aucune baseline à HEAD (compartiment absent de HEAD ?). Seul l'Invariant 2 (compte de lignes '^Phase:') a été vérifié. Ceci est une NOTICE, PAS un écart."
                  ;;
                *)
                  _fsi_note "$_fsi_rel : rc=$_fsi_rc2, attendu 0 (conforme), 3 (Invariant 1 sauté) ou non-initialisé détecté en amont par is_non_init"
                  ;;
              esac
            done <<< "$_fsi_ws_list"
            [ "$_fsi_n" -ge 1 ] || { echo "::error::aucun compartiment énuméré — vérité vide"; return 1; }
            echo "== BILAN check-state-integrity ($lab_root_abs) : $_fsi_fail écart(s) sur $_fsi_n compartiment(s) =="
            [ "$_fsi_fail" -eq 0 ]
          }

          # --- 0/6 + 1/6 + 2/6 BASCULE sur fixture jetable, AVANT le checkout réel (QUAL-01, patron
          # `check-instruction-budget`). Sans elle, les deux branches RÉELLES de ce dépôt
          # (`fiabilite` conforme, `gouvernance` non-initialisé) sont toutes DEUX vertes et aucune
          # assertion de cette étape ne peut rougir. CONSTRUCTION : la fixture est COMMITÉE dans un
          # état CONFORME, la mutation vient APRÈS dans le WORKING TREE — c'est le diff
          # working-tree/HEAD que `check-state-integrity.sh` compare. Committer directement un état
          # cassé rendrait la « réparation » ultérieure incapable de reverdir. --------------------
          T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
          SAIN_FM='---
          gsd_state_version: 1.0
          milestone: m1
          current_phase: 1
          status: executing
          progress:
            total_phases: 1
            completed_phases: 0
            total_plans: 1
            completed_plans: 0
          ---
          Phase: 1'
          git -C "$T" init -q
          mkdir -p "$T/.planning/workstreams/sain" "$T/.planning/workstreams/candidat"
          printf '%s\n' "$SAIN_FM" > "$T/.planning/workstreams/sain/STATE.md"
          printf '%s\n' "$SAIN_FM" > "$T/.planning/workstreams/candidat/STATE.md"
          git -C "$T" add -A
          git -C "$T" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture-saine-initiale (deux compartiments conformes, commités)"

          rc=0; fanout_check_state_integrity "$T" >"$T/out0" 2>&1 || rc=$?
          cat "$T/out0"
          echo "== 0/6 fixture saine construite : rc=$rc =="
          [ "$rc" -eq 0 ] || { echo "::error::0/6 : fixture saine construite mais rc=$rc — construction invalide avant même la mutation"; exit 1; }

          # --- 1/6 MUTATION en place (working tree, NON commitée) : candidat -> cassé -------------
          cat > "$T/.planning/workstreams/candidat/STATE.md" <<'EOF'
          ---
          workstream: candidat
          created: "2026-09-23"
          milestone: ""
          ---
          Phase: 1
          EOF
          rc=0; fanout_check_state_integrity "$T" >"$T/out1" 2>&1 || rc=$?
          cat "$T/out1"
          echo "== 1/6 mutation appliquée (candidat cassé) : rc=$rc =="
          [ "$rc" -eq 1 ] || { echo "::error::1/6 : rc=$rc, attendu 1 — le compartiment candidat cassé doit faire échouer le fan-out"; exit 1; }
          grep -q 'candidat' "$T/out1" || { echo "::error::1/6 : le compartiment fautif « candidat » n'est pas nommé dans le verdict"; exit 1; }

          # --- 2/6 RÉPARATION : working tree restauré À L'IDENTIQUE du contenu commité ------------
          printf '%s\n' "$SAIN_FM" > "$T/.planning/workstreams/candidat/STATE.md"
          rc=0; fanout_check_state_integrity "$T" >"$T/out2" 2>&1 || rc=$?
          cat "$T/out2"
          echo "== 2/6 fixture réparée : rc=$rc =="
          [ "$rc" -eq 0 ] || { echo "::error::2/6 : rc=$rc, attendu 0 — réparé à l'identique du commit, candidat doit redevenir conforme"; exit 1; }

          # --- 3/6 mesure du CHECKOUT RÉEL (`fiabilite` conforme, `gouvernance` non-initialisé —
          # ne doit JAMAIS échouer à cause de `gouvernance`, D-06). Aucun nom de compartiment n'est
          # cité ici : ils viennent tous de `vf_ws_enumerate`. -------------------------------------
          rc=0; fanout_check_state_integrity "." || rc=$?
          echo "== 3/6 checkout réel : rc=$rc =="
          if [ "$rc" -ne 0 ]; then exit 1; fi

          # --- 4/6 rc=3 NOMINAL : un arbre AVEC `.planning` mais SANS `workstreams/` est un dépôt
          # NON PARTITIONNÉ — état nominal. rc=0 et une NOTICE, jamais une ::error:: ni un rc=1. ---
          T4=$(mktemp -d); mkdir -p "$T4/.planning"; git -C "$T4" init -q
          git -C "$T4" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q --allow-empty -m init
          rc=0; fanout_check_state_integrity "$T4" >"$T4/out4" 2>&1 || rc=$?
          cat "$T4/out4"
          echo "== 4/6 dépôt NON partitionné (rc=3 attendu de la primitive) : rc=$rc =="
          [ "$rc" -eq 0 ] || { echo "::error::4/6 : rc=$rc, attendu 0 — un dépôt non partitionné est l'état NOMINAL, jamais un écart"; exit 1; }
          # NB : `grep -q X && { ...; }` est un PIÈGE sous `bash -e {0}` (la forme réelle de GitHub
          # Actions) — quand grep NE trouve RIEN (le cas SOUHAITÉ ici), la liste AND rend non-zéro
          # et `set -e` fait échouer l'étape. Toujours la forme `if ! grep ...` / `if grep ...`.
          if grep -q '::error::' "$T4/out4"; then echo "::error::4/6 : une ::error:: a été émise sur l'état nominal"; exit 1; fi
          grep -q 'NON PARTITIONNÉ' "$T4/out4" || { echo "::error::4/6 : le verdict nominal n'est pas NOMMÉ"; exit 1; }
          rm -rf "$T4"

          # --- 5/6 compartiment NON COMMITÉ, absent de HEAD, frontmatter CASSÉ. C'est LA CONDITION
          # DU TERRAIN que trois tours de vérification ont manquée, parce que TOUTES les fixtures du
          # parc sont commitées. Attendu : rc=0 (ce n'est PAS un écart, sinon tout compartiment neuf
          # rougirait) MAIS la notice INVARIANT1-SAUTE PRÉSENTE — la dégradation cesse d'être
          # invisible au verdict. ------------------------------------------------------------------
          T6=$(mktemp -d); git -C "$T6" init -q
          git -C "$T6" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q --allow-empty -m init
          mkdir -p "$T6/.planning/workstreams/neuf"
          printf '%s\n' '---' 'gsd_state_version: 1.0' 'milestone:' '---' 'Phase: 1' > "$T6/.planning/workstreams/neuf/STATE.md"
          rc=0; fanout_check_state_integrity "$T6" >"$T6/out5" 2>&1 || rc=$?
          cat "$T6/out5"
          echo "== 5/6 compartiment NON COMMITÉ, frontmatter cassé : rc=$rc =="
          [ "$rc" -eq 0 ] || { echo "::error::5/6 : rc=$rc, attendu 0 — un compartiment neuf ne doit jamais rougir"; exit 1; }
          grep -q 'INVARIANT1-SAUTE' "$T6/out5" || { echo "::error::5/6 : l'Invariant 1 a été sauté SANS que le verdict le dise — dégradation silencieuse"; exit 1; }
          # contre-épreuve : LE MÊME fichier, une fois COMMITÉ, doit redevenir un ÉCART (rc=1)
          git -C "$T6" add -A
          git -C "$T6" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "neuf commité"
          rc=0; fanout_check_state_integrity "$T6" >"$T6/out5b" 2>&1 || rc=$?
          echo "== 5/6b MÊME contenu, commité : rc=$rc =="
          [ "$rc" -eq 1 ] || { echo "::error::5/6b : rc=$rc, attendu 1 — le même frontmatter cassé, commité, DOIT compter comme écart ; sinon la bascule ne prouve rien"; cat "$T6/out5b"; exit 1; }
          rm -rf "$T6"

          # --- 6/6 VERDICT NOMMÉ D'AMBIGUÏTÉ (D-02 amendée) : frontmatter nominal (2 clés) + du
          # contenu à côté = NOTICE qui nomme les DEUX lectures, jamais un échec. Le MÊME
          # frontmatter SANS contenu à côté = non-initialisé SIMPLE, SANS la notice. Les deux
          # restent des NON-ÉCHECS. ----------------------------------------------------------------
          T7=$(mktemp -d); git -C "$T7" init -q
          git -C "$T7" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q --allow-empty -m init
          mkdir -p "$T7/.planning/workstreams/carve" "$T7/.planning/workstreams/vierge"
          printf '%s\n' '---' 'workstream: carve' 'created: 2026-09-23' '---' > "$T7/.planning/workstreams/carve/STATE.md"
          printf '%s\n' '---' 'workstream: vierge' 'created: 2026-09-23' '---' > "$T7/.planning/workstreams/vierge/STATE.md"
          printf '# Feuille de route\n\n## Phase 1\n' > "$T7/.planning/workstreams/carve/ROADMAP.md"
          rc=0; fanout_check_state_integrity "$T7" >"$T7/out6" 2>&1 || rc=$?
          cat "$T7/out6"
          echo "== 6/6 ambiguïté D-02 : rc=$rc =="
          [ "$rc" -eq 0 ] || { echo "::error::6/6 : rc=$rc, attendu 0 — ni le non-initialisé simple ni l'ambiguïté ne sont des échecs (D-02 amendée)"; exit 1; }
          n_amb=$(awk 'index($0, "AMBIGUITE-D02") > 0 {c++} END{print c+0}' "$T7/out6")
          [ "$n_amb" -eq 1 ] || { echo "::error::6/6 : $n_amb notice(s) AMBIGUITE-D02, attendu EXACTEMENT 1 — « carve » (contenu à côté) doit la produire, « vierge » (rien à côté) doit NE PAS la produire"; exit 1; }
          grep -q 'carve : AMBIGUITE-D02' "$T7/out6" || { echo "::error::6/6 : la notice ne nomme pas le bon compartiment"; exit 1; }
          rm -rf "$T7"

      - name: check-capability-activation (une entrée de doc ne promet pas un geste inerte, GSDA-09)
        # POURQUOI CE CÂBLAGE EXISTE. Le gate était livré, testé, distribué dans chaque lab — et
        # référencé par RIEN d'exécutable : ni ce job, ni un hook, ni un agent, ni un skill. Sa
        # seule invocation vivait dans la suite du module. Une garde que la chaîne d'intégration ne
        # lance jamais est une garde absente : c'est exactement le mode d'échec (« routé, donc
        # réputé vivant ») que ce gate existe pour fermer, reproduit un étage plus haut sur
        # lui-même.
        #
        # Aucune surcharge `VF_CAPACT_*` : la cascade de résolution du lab est exercée telle qu'elle
        # tourne chez l'utilisateur. Un exit 2 (NON VÉRIFIABLE) échoue le job au même titre qu'un
        # exit 1 — un gate qui ne peut pas se prononcer n'est pas un gate vert.
        run: bash plugin/dev-orchestrator/scripts/check-capability-activation.sh

      - name: check-machine-paths (aucun chemin absolu de machine dans les fichiers versionnés)
        # POURQUOI CE GATE EST BLOQUANT ET PAS ADVISORY. Le défaut qu'il ferme est une ACCUMULATION,
        # pas un incident : mesurée le 2026-08-04, elle touchait 19 fichiers suivis dont 18 déjà
        # publiés sur `main`, tous écrits sans intention par des artefacts de session qui recopient
        # le chemin que l'outil leur a rendu. Un gate advisory sur une accumulation ne change pas la
        # pente — il documente la dérive pendant qu'elle continue. La ligne de base est à ZÉRO
        # depuis le nettoyage, donc le coût de le tenir vert est nul, et les trois échappatoires
        # (segment placeholder, segment non identifiant `<user>`, marqueur `vf-allow-machine-path`)
        # couvrent les besoins légitimes SANS qu'on ait à contourner le gate — c'est précisément le
        # motif qui a fait refuser `hooks.community` (ADR-067 : une mesure qu'on désarme en la
        # contournant tous les jours).
        #
        # `fetch-depth: 0` est déjà posé sur ce job (check-release-tag) : `git ls-files` a bien son
        # index. Un exit 2 (cible vide, hors dépôt git) échoue le job au même titre qu'un exit 1 —
        # un gate qui n'a pas pu regarder n'est pas un gate vert.
        run: bash scripts/check-machine-paths.sh

      - name: check-instruction-budget (BUDG-01/02/04/05, ADR-029 machine-enforced)
        # POURQUOI CE GATE EXISTE. Gate distribué depuis la Phase 25 : plafond de lignes des
        # agents (D-05) et charge d'instructions (D-01/D-02), tous deux hors du seul module
        # dev-orchestrator (`test-dev-orchestrator.sh` T3/T5, mono-module). Le ratchet est ARMÉ
        # sur `main` depuis le commit `a7f414a` (sentinelle `.planning/.instruction-budget-armed`
        # posée, Phase 25) : ce n'est plus un état hypothétique, c'est le régime normal de ce
        # dépôt. Révisé en Phase 40.1 (arbitrages Samuel D-01/D-02/D-05/D-07, AskUserQuestion
        # session principale, relais SendMessage, 2026-09-16) : plafond porté à 300 lignes,
        # avertissement non bloquant dès 251, ratchet ne bloquant plus que les instructions, par
        # fichier. Une étape qui se contenterait de constater l'état sur ce dépôt armé serait
        # verte par construction si elle perdait sa capacité à discriminer — exactement le mode
        # d'échec « sûr mais inerte » d'ADR-059 que ce dépôt a déjà payé. Les sept bascules
        # ISOLÉES ci-dessous, sur fixture jetable ré-armée à chaque fois depuis zéro, existent
        # pour que cette étape prouve elle-même qu'elle sait encore rendre rouge sur CHAQUE garde
        # séparément, patron `check-divergence.sh en CI` (Phase 39, plus bas dans ce même job).
        run: |
          set -eu

          fail=0
          note() { echo "::error::check-instruction-budget CI : $1"; fail=$((fail + 1)); }

          S="plugin/conductor/scripts/check-instruction-budget.sh"

          # --- Bloc 1 — sept bascules ISOLÉES sur fixture jetable, chacune reconstruite depuis
          # --- zéro par write_base() : une seule mutation à la fois, jamais cumulée -------------
          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          write_base() {
            mkdir -p "$FIX/plugin/demo/agents" "$FIX/.planning"
            cat > "$FIX/plugin/demo/agents/a.md" <<'AGENTEOF'
          ---
          name: d
          ---
          ## Iron Laws
          - Le lock est verifie avant tout checkout.
          Une ligne de prose neutre.
          AGENTEOF
          }

          grow_to() {
            local n="$1"
            awk -v n="$n" '{print} END{for (i = NR + 1; i <= n; i++) print "Ligne de remplissage neutre."}' \
              "$FIX/plugin/demo/agents/a.md" > "$FIX/.grow.tmp"
            mv "$FIX/.grow.tmp" "$FIX/plugin/demo/agents/a.md"
          }

          write_base
          : > "$FIX/.planning/.instruction-budget-armed"

          L="$(awk 'END{print NR}' "$FIX/plugin/demo/agents/a.md")"
          mrc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || mrc=$?
          if [ "$mrc" -ne 2 ]; then
            note "mesure de reference (arme, sans baseline) : rc=$mrc, attendu 2"
          fi
          I="$(printf '%s\n' "$out" | awk -F'|' '/^plugin\/demo\/agents\/a\.md /{gsub(/[[:space:]]/,"",$4); print $4}')"
          printf 'plugin/demo/agents/a.md\t%s\t%s\n' "$L" "$I" > "$FIX/.planning/instruction-budget-baselines.tsv"

          # 1/7 fixture de base, armée, baseline exacte → attendu 0
          write_base
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 1/7 fixture de base conforme : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "1/7 fixture de base : rc=$rc, attendu 0"

          # 2/7 une ligne neutre ajoutée (aucune instruction) → attendu 0, LIGNES-EN-HAUSSE, jamais
          # DEPASSEMENT (D-02/D-H6 : la colonne lignes ne bloque plus jamais)
          write_base
          printf '%s\n' 'Encore une ligne de prose neutre.' >> "$FIX/plugin/demo/agents/a.md"
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 2/7 ligne neutre ajoutée : rc=$rc =="; printf '%s\n' "$out"
          has_hausse=0; case "$out" in *"LIGNES-EN-HAUSSE"*) has_hausse=1 ;; esac
          has_dep=0; case "$out" in *"DEPASSEMENT"*) has_dep=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has_hausse" -ne 1 ] || [ "$has_dep" -ne 0 ]; then
            note "2/7 ligne neutre ajoutée : rc=$rc (attendu 0), LIGNES-EN-HAUSSE=$has_hausse (attendu 1), DEPASSEMENT=$has_dep (attendu 0)"
          fi

          # 3/7 dernière ligne réécrite en instruction, même nombre de lignes (vers temporaire puis
          # mv, jamais sed -i) → attendu 1, DEPASSEMENT-INSTR
          write_base
          total="$(awk 'END{print NR}' "$FIX/plugin/demo/agents/a.md")"
          awk -v n="$total" 'NR==n{print "Cette ligne DOIT compter."; next} {print}' \
            "$FIX/plugin/demo/agents/a.md" > "$FIX/.rewrite.tmp"
          mv "$FIX/.rewrite.tmp" "$FIX/plugin/demo/agents/a.md"
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 3/7 dernière ligne réécrite en instruction : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || note "3/7 instruction ajoutée : rc=$rc, attendu 1"
          case "$out" in *"DEPASSEMENT-INSTR"*) : ;; *) note "3/7 instruction ajoutée : DEPASSEMENT-INSTR absent" ;; esac

          # 4/7 allongée à exactement 300 lignes (plafond) → attendu 0, AVERTISSEMENT-ADR029
          write_base
          grow_to 300
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 4/7 allongée au plafond (300 lignes) : rc=$rc =="; printf '%s\n' "$out"
          has_av=0; case "$out" in *"AVERTISSEMENT-ADR029"*) has_av=1 ;; esac
          if [ "$rc" -eq 0 ] && [ "$has_av" -eq 1 ]; then
            echo "::warning::check-instruction-budget CI : 4/7 zone d'avertissement ADR-029 (dès 251 lignes, non bloquant) prouvée"
          else
            note "4/7 allongée au plafond : rc=$rc (attendu 0), AVERTISSEMENT-ADR029=$has_av (attendu 1)"
          fi

          # 5/7 allongée à 301 lignes (au-delà du plafond) → attendu 1, DEPASSEMENT-ADR029
          write_base
          grow_to 301
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 5/7 allongée au-delà du plafond (301 lignes) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || note "5/7 au-delà du plafond : rc=$rc, attendu 1"
          case "$out" in *"DEPASSEMENT-ADR029"*) : ;; *) note "5/7 au-delà du plafond : DEPASSEMENT-ADR029 absent" ;; esac

          # 6/7 sentinelle retirée, rien d'autre changé → attendu 3 (ratchet)
          write_base
          rm -f "$FIX/.planning/.instruction-budget-armed"
          rc=0
          out="$(bash "$S" --path "$FIX" 2>&1)" || rc=$?
          echo "== 6/7 sentinelle retirée : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 3 ] || note "6/7 sentinelle retirée : rc=$rc, attendu 3"

          # 7/7 répertoire vide → attendu 2 (découverte vide, jamais un vert)
          VIDE="$FIX/vide"
          mkdir -p "$VIDE"
          rc=0
          out="$(bash "$S" --path "$VIDE" 2>&1)" || rc=$?
          echo "== 7/7 découverte vide : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 2 ] || note "7/7 découverte vide : rc=$rc, attendu 2"

          rm -rf "$FIX"

          echo "== BILAN preuve fixture : $fail écart(s) sur 7 verdicts =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-instruction-budget DISCRIMINANT en CI : les sept bascules isolées sont prouvées =="

          # --- Bloc 2 — dépôt réel, cascade de résolution exercée telle qu'elle tourne en réel -
          armed=0
          [ -f ".planning/.instruction-budget-armed" ] && armed=1

          rc=0
          out="$(bash "$S" 2>&1)" || rc=$?
          echo "== dépôt réel (checkout CI, sentinelle armée=$armed) : rc=$rc =="; printf '%s\n' "$out"

          if [ "$armed" -eq 0 ]; then
            case "$rc" in
              3)
                echo "::warning::check-instruction-budget : ratchet NON ARMÉ (sentinelle absente) — anomalie : le ratchet est armé sur main depuis a7f414a (Phase 25), révisé en Phase 40.1 ; si ce warning apparaît sur main, la sentinelle a disparu sans arbitrage nommé"
                ;;
              *)
                echo "::error::check-instruction-budget : sentinelle absente mais code=$rc (attendu 3) — le ratchet se serait inversé ou le gate serait devenu incapable de se prononcer"
                exit 1
                ;;
            esac
          else
            case "$rc" in
              0)
                echo "== check-instruction-budget : gate armé et conforme =="
                printf '%s\n' "$out" | while IFS= read -r ligne; do
                  case "$ligne" in
                    *"AVERTISSEMENT-ADR029"*)
                      fichier="${ligne%% |*}"
                      echo "::warning::check-instruction-budget : $fichier en zone d'avertissement ADR-029 (dès 251 lignes, non bloquant)"
                      ;;
                  esac
                done
                ;;
              1)
                echo "::error::check-instruction-budget : dépassement de baseline détecté sur le dépôt réel armé"
                exit 1
                ;;
              2)
                echo "::error::check-instruction-budget : découverte vide ou entrée non vérifiable sur le dépôt réel armé"
                exit 1
                ;;
              *)
                echo "::error::check-instruction-budget : sentinelle présente mais code=$rc — le gate se croirait non armé alors qu'il ne l'est pas"
                exit 1
                ;;
            esac
          fi

      - name: Gates workstream-aware sur un arbre RÉELLEMENT partitionné (fixture jetable) + non-régression racine
        # POURQUOI CETTE ÉTAPE EXISTE (plan 24-09, exigence GSDA-17). Les trois gates rendus
        # workstream-aware au plan 24-04 et le gate de pointeur créé au plan 24-05 sont tous VERTS
        # PAR DÉFAUT sur le checkout racine, qui n'est pas partitionné — et ce dépôt ne doit PAS
        # l'être tant qu'une phase est en vol. Leur comportement neuf n'est donc exercé NULLE PART
        # sans cette étape, et la couverture se retournerait en faux vert : exactement le trou que
        # la zone 3 referme. Le seul moyen honnête est que le job construise lui-même la partition,
        # PROUVE qu'elle est discriminante, et échoue si elle n'a pas pu être bâtie.
        #
        # `GSD_WORKSTREAM` est le canal exercé en premier : c'est le canal NOMINAL (ADR-064 amendé),
        # canal de premier rang de `resolveActiveWorkstream` amont.
        run: |
          set -eu

          fail=0
          note() { echo "::error::gates workstream : $1"; fail=$((fail + 1)); }

          # ═══ BLOC 1 — ASSERTION DE CAPACITÉ : les gates voient-ils une partition ? ═══════════
          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          mkdir -p "$FIX/.planning/workstreams/dev"
          printf '# Projet fixture\n\nArbre synthétique construit par la CI.\n' > "$FIX/.planning/PROJECT.md"
          printf '{ "workflow": {} }\n' > "$FIX/.planning/config.json"
          printf '# Feuille de route (compartiment dev)\n\n## Phase 1 : fixture\n\nObjectif synthétique.\n' \
            > "$FIX/.planning/workstreams/dev/ROADMAP.md"
          cat > "$FIX/.planning/workstreams/dev/STATE.md" <<'STATEEOF'
          ---
          milestone: fixture
          current_phase: 1
          status: in_progress
          progress:
            completed_phases: 0
            completed_plans: 0
            total_plans: 1
          ---

          Phase: 1 — fixture du compartiment dev

          Etat synthetique construit par la CI.
          STATEEOF

          # Dépôt git initialisé ET commité : check-state-integrity.sh exige un dépôt git et
          # compare le fichier de travail à HEAD. Sans commit il sortirait en 2 « non vérifiable »
          # et le job mesurerait la mauvaise chose. Identité locale : le runner n'en a pas.
          git -C "$FIX" init -q
          git -C "$FIX" add .planning
          git -C "$FIX" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture partitionnee"

          # --- Assertion de CONSTRUCTION, AVANT toute mesure (contrat F13, en-tête de ce fichier) ---
          for f in .planning/PROJECT.md .planning/config.json \
                   .planning/workstreams/dev/ROADMAP.md .planning/workstreams/dev/STATE.md; do
            if [ ! -f "$FIX/$f" ]; then
              echo "::error::fixture partitionnée non construite : $f manquant — refus de mesurer une cible absente"
              exit 1
            fi
          done
          # La racine du .planning de la fixture DOIT rester vide de ces deux fichiers : c'est
          # exactement ce qui rend la fixture discriminante (verdicts 5 et 6). Leur présence rendrait
          # le job vert sur une fixture qui ne prouve plus rien.
          for f in .planning/ROADMAP.md .planning/STATE.md; do
            if [ -e "$FIX/$f" ]; then
              echo "::error::fixture non discriminante : $f existe alors que la racine du .planning de la fixture doit en être VIDE"
              exit 1
            fi
          done
          echo "== fixture partitionnée construite et commitée : $FIX =="

          # --- 1/6 : gate de démarrage, workstream résolu par l'environnement ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX" 2>/dev/null)" || rc=$?
          echo "== 1/6 check-dev-bootstrap (GSD_WORKSTREAM=dev) rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 3 ] || note "1/6 check-dev-bootstrap : rc=$rc, attendu 3 (orientation gsd-engine)"
          case "$out" in
            *"Projet piloté par GSD"*) : ;;
            *) note "1/6 check-dev-bootstrap : stdout ne porte pas l'orientation « Projet piloté par GSD » — le compartiment dev n'a pas été lu" ;;
          esac
          case "$out" in
            *"[bootstrap]"*) note "1/6 check-dev-bootstrap : signal [bootstrap] rendu alors que le compartiment dev est complet — la résolution de workstream n'a pas eu lieu" ;;
          esac

          # --- 2/6 : gate d'intégrité d'état — le fichier VÉRIFIÉ doit être celui du compartiment ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/conductor/scripts/check-state-integrity.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 2/6 check-state-integrity rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "2/6 check-state-integrity : rc=$rc, attendu 0 (conforme)"
          case "$out" in
            *".planning/workstreams/dev/STATE.md conforme"*) : ;;
            *) note "2/6 check-state-integrity : le fichier vérifié n'est pas .planning/workstreams/dev/STATE.md — la résolution de workstream n'a pas eu lieu" ;;
          esac

          # --- 3/6 : injecteur de contexte. Contrat FAIL-OPEN : il sort TOUJOURS 0, l'assertion qui
          # porte la preuve est donc celle sur sa SORTIE, jamais celle sur son code. ---
          rc=0
          out="$(GSD_WORKSTREAM=dev bash plugin/planning-core/scripts/planning-context.sh --path "$FIX/.planning" 2>/dev/null)" || rc=$?
          echo "== 3/6 planning-context rc=$rc =="; printf '%s\n' "$out" | head -4
          [ "$rc" -eq 0 ] || note "3/6 planning-context : rc=$rc, attendu 0 (contrat fail-open)"
          case "$out" in
            *'STATE.md du workstream `dev`'*) : ;;
            *) note "3/6 planning-context : l'en-tête d'injection ne nomme pas le workstream dev — l'extrait vient de la racine" ;;
          esac

          # --- 4/6 : gate de pointeur. En mode non-hook son verdict part sur stderr : on ISOLE
          # stderr (2>&1 >/dev/null), jamais un 2>&1 global qui satisferait une assertion depuis
          # la mauvaise voie. ---
          rc=0
          err="$(GSD_WORKSTREAM=dev bash plugin/conductor/scripts/check-workstream-pointer.sh --path "$FIX" 2>&1 >/dev/null)" || rc=$?
          echo "== 4/6 check-workstream-pointer (GSD_WORKSTREAM=dev) rc=$rc =="; printf '%s\n' "$err"
          [ "$rc" -eq 0 ] || note "4/6 check-workstream-pointer : rc=$rc, attendu 0 (conforme)"
          case "$err" in
            *"canal env (GSD_WORKSTREAM)"*) : ;;
            *) note "4/6 check-workstream-pointer : le canal d'environnement n'est pas nommé dans le verdict" ;;
          esac

          # --- 5/6 : PREUVE DE DISCRIMINANCE — MÊMES fichiers, workstream NON résolu. Sans ce
          # verdict contraire, les quatre précédents seraient satisfaits par un arbre non partitionné. ---
          # TMPDIR ISOLÉ, en 5/6 comme en 6/6. Le message asserté en 6/6 nomme un canal RÉSIDUEL
          # (« pointeur de session en os.tmpdir() ») : laisser les deux verdicts partager le TMPDIR
          # de l'exécuteur, c'est laisser un pointeur de session déposé par n'importe quelle autre
          # étape décider du résultat. 5/6 ne l'isolait pas, 6/6 non plus — l'asymétrie était
          # d'autant plus trompeuse que la moitié des `env -u` y était déjà.
          mkdir -p "$FIX/tmp-isole"
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            TMPDIR="$FIX/tmp-isole" \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX" 2>/dev/null)" || rc=$?
          echo "== 5/6 check-dev-bootstrap (sans workstream) rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "5/6 check-dev-bootstrap sans workstream : rc=$rc, attendu 0 (démarrage inachevé)"
          case "$out" in
            *"[bootstrap]"*"feuille de route absente"*) : ;;
            *) note "5/6 check-dev-bootstrap sans workstream : le signal [bootstrap] « feuille de route absente » est absent — la fixture n'est PAS discriminante, le même verdict sortirait avec et sans workstream" ;;
          esac

          # --- 6/6 : PREUVE DE DISCRIMINANCE — le gate de pointeur bascule 0 → 1 sur les MÊMES
          # fichiers. Les sous-chaînes cherchées sont celles du SEUL état 4 : « GSD_WORKSTREAM » nu
          # et « ADR-064 » nu apparaissent AUSSI dans le message de conformité (« composable avec
          # ADR-064 »), ils ne discrimineraient donc rien — mesuré au banc de mutation. ---
          rc=0
          err="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            TMPDIR="$FIX/tmp-isole" \
            bash plugin/conductor/scripts/check-workstream-pointer.sh --path "$FIX" 2>&1 >/dev/null)" || rc=$?
          echo "== 6/6 check-workstream-pointer (sans workstream) rc=$rc =="; printf '%s\n' "$err"
          [ "$rc" -eq 1 ] || note "6/6 check-workstream-pointer sans workstream : rc=$rc, attendu 1 (partitionné, aucun canal composable ne résout)"
          case "$err" in
            *"export GSD_WORKSTREAM=<nom>"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : le remède (export GSD_WORKSTREAM=<nom>) est absent du message" ;;
          esac
          case "$err" in
            *"os.tmpdir()"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : le motif (pointeur de session en os.tmpdir()) est absent du message" ;;
          esac
          case "$err" in
            *"non composable avec"*) : ;;
            *) note "6/6 check-workstream-pointer sans workstream : la NON-composabilité avec ADR-064 est absente du message" ;;
          esac

          rm -rf "$FIX"

          # ═══ BLOC 2a — NON-RÉGRESSION sur un ARBRE FLAT SYNTHÉTIQUE (jamais partitionné) ═══
          # CE QUE CE BLOC PROUVE, ET CE QU'IL NE PROUVE PAS. Avant la partition D-02 (2026-09-23),
          # ce bloc rejouait R1/R2/R3 contre le checkout RACINE de ce dépôt, en s'appuyant sur le
          # fait qu'il n'était pas partitionné — cette garantie protégeait tous les labs qui
          # installent VibeFlow SANS jamais partitionner leur `.planning/`. La migration a rendu la
          # racine DE CE dépôt partitionnée par défaut : la réutiliser comme cible « non
          # partitionnée » serait désormais FAUX PAR CONSTRUCTION. Ce bloc reconstruit donc sa
          # propre fixture FLAT jetable (ROADMAP.md + STATE.md triviaux à la racine du `.planning/`
          # de la fixture, AUCUN `.planning/workstreams/`) et rejoue EXACTEMENT le même contrat
          # qu'avant — rc=3/stdout invariant, rc=3/stdout vide, rc=0/extrait non vide — contre CETTE
          # fixture plutôt que contre `.`. C'est une assertion de NON-RÉGRESSION, à ne jamais
          # confondre à la relecture avec les six verdicts du bloc 1, qui sont des assertions de
          # CAPACITÉ sur un arbre partitionné.
          echo "== 2a : non-régression sur une fixture FLAT jetable (jamais partitionnée) =="

          FIX2="$(mktemp -d)"
          trap 'rm -rf "$FIX" "$FIX2"' EXIT

          mkdir -p "$FIX2/.planning"
          printf '# Feuille de route\n\n## Phase 1 : fixture\n\nObjectif synthétique.\n' \
            > "$FIX2/.planning/ROADMAP.md"
          cat > "$FIX2/.planning/STATE.md" <<'STATEEOF2'
          ---
          milestone: fixture
          current_phase: 1
          status: in_progress
          progress:
            completed_phases: 0
            completed_plans: 0
            total_plans: 1
          ---

          Phase: 1 — fixture flat

          Etat synthetique construit par la CI.
          STATEEOF2

          git -C "$FIX2" init -q
          git -C "$FIX2" add .planning
          git -C "$FIX2" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture-flat"

          # --- Assertion de CONSTRUCTION, AVANT toute mesure (même contrat que le BLOC 1) ---
          for f in .planning/ROADMAP.md .planning/STATE.md; do
            if [ ! -f "$FIX2/$f" ]; then
              echo "::error::fixture flat non construite : $f manquant — refus de mesurer une cible absente"
              exit 1
            fi
          done
          if [ -d "$FIX2/.planning/workstreams" ]; then
            echo "::error::fixture flat non discriminante : .planning/workstreams/ existe alors que la fixture doit rester NON partitionnée"
            exit 1
          fi
          echo "== fixture flat construite et commitée : $FIX2 =="

          # R1 — gate de démarrage : exit 3, stdout strictement INVARIANT selon GSD_WORKSTREAM.
          rc=0
          out1="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX2" 2>/dev/null)" || rc=$?
          rc2=0
          out2="$(env -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM GSD_WORKSTREAM=dev \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path "$FIX2" 2>/dev/null)" || rc2=$?
          echo "== R1 check-dev-bootstrap (fixture flat) : rc(sans)=$rc rc(avec)=$rc2, stdout ${#out1}/${#out2} octet(s) =="
          [ "$rc" -eq 3 ] || note "R1 check-dev-bootstrap flat sans workstream : rc=$rc, attendu 3"
          [ "$rc2" -eq 3 ] || note "R1 check-dev-bootstrap flat avec workstream : rc=$rc2, attendu 3 (un arbre non partitionné ne doit pas changer de verdict)"
          [ "$out1" = "$out2" ] || note "R1 check-dev-bootstrap flat : le stdout CHANGE selon GSD_WORKSTREAM sur un arbre NON partitionné — la résolution de workstream a fui hors de son domaine"

          # R2 — gate de pointeur : exit 3 ET stdout STRICTEMENT VIDE.
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM \
            bash plugin/conductor/scripts/check-workstream-pointer.sh --path "$FIX2" 2>/dev/null)" || rc=$?
          echo "== R2 check-workstream-pointer (fixture flat) : rc=$rc, stdout de ${#out} octet(s) =="
          [ "$rc" -eq 3 ] || note "R2 check-workstream-pointer flat : rc=$rc, attendu 3 (silence, dépôt non partitionné)"
          [ -z "$out" ] || note "R2 check-workstream-pointer flat : stdout NON vide sur un dépôt non partitionné — le coût de la garde doit être nul là où il n'y a rien à garder"

          # R3 — injecteur de contexte : exit 0 et extrait NON VIDE. Pas un gate bloquant au sens
          # ADR-074 (contrat fail-open déjà documenté plus haut, verdict 3/6 du BLOC 1) : version
          # simplifiée, rc=0 + extrait non vide suffit.
          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_CONTEXT_WORKSTREAM \
            bash plugin/planning-core/scripts/planning-context.sh --path "$FIX2/.planning" 2>/dev/null)" || rc=$?
          echo "== R3 planning-context (fixture flat) : rc=$rc, $(printf '%s\n' "$out" | awk 'END{print NR}') ligne(s) =="
          [ "$rc" -eq 0 ] || note "R3 planning-context flat : rc=$rc, attendu 0"
          [ -n "$out" ] || note "R3 planning-context flat : extrait VIDE — l'injection de contexte ne produit plus rien"

          rm -rf "$FIX2"

          # ═══ BLOC 2b — CONFORMITÉ de la RACINE RÉELLE, PARTITIONNÉE PAR DÉFAUT ═══════════════
          # Depuis le 2026-09-23 la racine de CE dépôt est un arbre partitionné VALIDE (deux
          # compartiments `fiabilite`/`gouvernance`, pointeur committé `.planning/active-workstream`
          # pointant sur `fiabilite`). Ce bloc vérifie que les gates la jugent CONFORME sans aucun
          # `GSD_WORKSTREAM` dans l'environnement — c'est une garantie PLUS FORTE que l'ancienne
          # assertion de non-régression : elle porte sur le dépôt RÉEL, pas sur une fixture.
          #
          # PREUVE QUE CETTE SECTION PEUT RENDRE ROUGE (ADR-074) : REJOUÉE LOCALEMENT le 2026-09-23
          # (mandat worker `partition-planning-d02`), jamais en CI permanente — muter la racine
          # réelle dans une étape CI serait une mutation destructive du dépôt lui-même. Protocole :
          # `mv .planning/active-workstream .planning/active-workstream.bak`, rejeu de
          # `check-workstream-pointer.sh --path .` → bascule observée rc=0 → rc=1, message
          # « aucun canal composable ne résout de workstream », restauration IMMÉDIATE du fichier
          # avant toute suite. Le même witness que le verdict 6/6 du BLOC 1, sur le dépôt réel.
          echo "== 2b : conformité de la racine réelle (partitionnée par défaut) =="

          rc=0
          err="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM \
            bash plugin/conductor/scripts/check-workstream-pointer.sh --path . 2>&1 >/dev/null)" || rc=$?
          echo "== R4 check-workstream-pointer racine : rc=$rc =="; printf '%s\n' "$err"
          [ "$rc" -eq 0 ] || note "R4 check-workstream-pointer racine : rc=$rc, attendu 0 (racine partitionnée, pointeur committé résout fiabilite)"
          case "$err" in
            *"store-partage"*) : ;;
            *) note "R4 check-workstream-pointer racine : le canal store-partagé n'est pas nommé dans le verdict" ;;
          esac
          case "$err" in
            *"fiabilite"*) : ;;
            *) note "R4 check-workstream-pointer racine : le workstream « fiabilite » n'est pas nommé dans le verdict" ;;
          esac

          # ═══ R5 — FAN-OUT PAR COMPARTIMENT (Phase 41.1, plan 41.1-06) ═════════════════════════
          # R5 invoquait `check-state-integrity.sh` sur un chemin LITTÉRAL
          # `.planning/workstreams/fiabilite/` : le second compartiment réel de ce dépôt
          # (`gouvernance`) n'était jamais mesuré ici. Il énumère désormais via `vf_ws_enumerate`.
          #
          # LE SOURCING EST PRESCRIT ICI, PAS SEULEMENT DANS L'AUTRE ÉDITION : un `run:` GitHub
          # Actions est un process shell NEUF par step — rien ne se partage entre steps, ni les
          # fonctions ni le `. `. Sans cette ligne, `vf_ws_enumerate` rend 127 (`command not
          # found`), la branche `*)` du `case` classe ce code en imprévu, et R5 serait ROUGE EN
          # PERMANENCE. Le fichier sourcé n'a AUCUN effet de bord au chargement : il n'initialise que
          # des globales `VF_WS_*`, qui ne collisionnent avec aucune variable de cette étape
          # (laquelle n'utilise que `fail`/`note`/`rc`/`out`/`err`).
          #
          # Les fonctions ci-dessous sont VERBATIM de l'étape `check-state-integrity` — deux process
          # shell distincts, donc deux copies, patron `check-instruction-budget` déjà en usage dans
          # ce fichier. Leur `local` + préfixe `_fsi_`/`_ini_`/`_wsc_` garantit que le `fail`/`note`
          # DE CETTE ÉTAPE (R1-R6, définis plus haut dans le MÊME bloc `run:`) ne sont JAMAIS
          # touchés — c'est la fonction elle-même qui le tient, pas un commentaire qui le promet.
          . plugin/planning-core/scripts/workstream-policy.sh

          # Classification D-02 INCONDITIONNELLE, par lecture directe du frontmatter — jamais une
          # dépendance de forme sur un libellé que `check-state-integrity.sh` n'émet pas (a2, D-04 ;
          # mesuré : ce script n'émet JAMAIS la sous-chaîne « non initialis »). Variables locales et
          # préfixées `_ini_` : `f`/`fm`/`keys`/`nkeys` en globales écraseraient les compteurs d'une
          # étape appelante sans un mot.
          is_non_init() { # <fichier STATE.md> -> rc 0 = non-initialisé, rc 1 = pas ce cas
            local _ini_f="$1" _ini_fm _ini_keys _ini_nkeys
            [ -r "$_ini_f" ] || return 1
            _ini_fm="$(awk '/^---[[:space:]]*$/{n++; if(n==1) next; if(n==2) exit} {print}' "$_ini_f")"
            _ini_keys="$(printf '%s\n' "$_ini_fm" | awk -F: 'NF>=2{gsub(/^[[:space:]]+|[[:space:]]+$/,"",$1); print $1}' | sort -u | awk 'NF')"
            _ini_nkeys="$(printf '%s\n' "$_ini_keys" | wc -l | tr -d ' ')"
            [ "$_ini_nkeys" -eq 2 ] || return 1
            printf '%s\n' "$_ini_keys" | grep -qx 'workstream' || return 1
            printf '%s\n' "$_ini_keys" | grep -qx 'created' || return 1
            return 0
          }

          # D-02 AMENDÉE le 2026-09-23 (arbitrage Samuel, AskUserQuestion session principale, Q1
          # option b) : « non initialisé » porte sur le FRONTMATTER SEUL. La clause « ET aucun
          # ROADMAP/REQUIREMENTS de contenu » est RETIRÉE — elle classait `gouvernance` CORROMPU
          # (STATE.md à 2 clés MAIS ROADMAP.md de 180 lignes, REQUIREMENTS.md, phases/), contre le
          # critère tranché « un compartiment neuf ne doit jamais rougir ». Ce que `is_non_init`
          # laisse passer EN SILENCE est le cas INVERSE — un STATE.md TRONQUÉ jusqu'aux 2 clés
          # nominales avec du contenu bien rempli à côté. Les deux ont la MÊME SIGNATURE SUR DISQUE.
          # D'où le VERDICT NOMMÉ D'AMBIGUÏTÉ plus bas : une NOTICE qui nomme les DEUX lectures et
          # n'en choisit AUCUNE. (Discriminer par l'historique git a été explicitement écarté : cela
          # ferait dépendre le verdict d'un passé que rien ne garantit présent.)
          ws_has_content() { # <dossier compartiment> -> rc 0 = du contenu existe à côté du STATE.md
            local _wsc_d="$1"
            if [ -s "$_wsc_d/ROADMAP.md" ]; then return 0; fi
            if [ -s "$_wsc_d/REQUIREMENTS.md" ]; then return 0; fi
            if [ -d "$_wsc_d/phases" ] && [ -n "$(ls -A "$_wsc_d/phases" 2>/dev/null || true)" ]; then return 0; fi
            return 1
          }
          # NOTE : un compartiment SANS STATE.md du tout (`[ -r ... ]` faux) n'est PAS classé
          # non-init — il tombe au script, qui rougira. C'EST VOULU : l'absence totale de STATE.md
          # n'est ni la facture nominale de `workstream create` (qui en écrit TOUJOURS un) ni un
          # état sain — c'est corrompu par construction, et l'échec audible est la posture
          # fail-closed cohérente avec le reste de cette étape.

          # Toutes les variables/fonctions internes sont locales et préfixées `_fsi_` : appelée
          # depuis une étape qui tient ses propres compteurs `fail`/`note`, cette fonction ne doit
          # JAMAIS pouvoir en effacer un (défaut déjà introduit puis fermé dans ce dépôt).
          fanout_check_state_integrity() { # <lab_root> -> bilan sur stdout, rc 0 = 0 écart, 1 = >=1
            local lab_root="$1" lab_root_abs planning_dir
            local _fsi_fail=0 _fsi_n=0 _fsi_rc=0 _fsi_wsdir _fsi_rel _fsi_statefile_rel _fsi_out _fsi_rc2 _fsi_ws_list
            lab_root_abs="$(cd "$lab_root" && pwd)"
            planning_dir="$lab_root_abs/.planning"
            _fsi_note() { echo "::error::check-state-integrity : $1"; _fsi_fail=$((_fsi_fail + 1)); }
            _fsi_ws_list="$(vf_ws_enumerate "$planning_dir")" || _fsi_rc=$?
            # rc=3 EST NOMINAL, JAMAIS UN ÉCART : le plan 41.1-01, PRODUCTEUR de la primitive,
            # déclare « 3 = SILENCE, workstreams/ absent (dépôt non partitionné, ÉTAT NOMINAL) ».
            # Le traiter comme un 2 ferait rougir la CI sur l'état que son propre producteur déclare
            # nominal — masqué sur CE dépôt (partitionné), mais la fixture voisine du MÊME job
            # construit des arbres NON partitionnés (BLOC 2a « non-régression FLAT »).
            case "$_fsi_rc" in
              0) : ;;
              3)
                echo "::notice::$planning_dir : aucun compartiment de workstream (workstreams/ absent) — dépôt NON PARTITIONNÉ, état NOMINAL. Rien à mesurer, AUCUN écart."
                return 0
                ;;
              2)
                echo "::error::vf_ws_enumerate $planning_dir : workstreams/ présent mais AUCUN compartiment vérifiable (lien symbolique, illisible, ou vide après filtrage anti-lien) — NON VÉRIFIABLE, jamais un vert par défaut"
                return 1
                ;;
              *)
                echo "::error::vf_ws_enumerate $planning_dir : code de sortie imprévu ($_fsi_rc, attendu 0/2/3) — NON VÉRIFIABLE"
                return 1
                ;;
            esac
            while IFS= read -r _fsi_wsdir; do
              [ -n "$_fsi_wsdir" ] || continue
              _fsi_n=$((_fsi_n + 1))
              _fsi_rel="${_fsi_wsdir#"$lab_root_abs"/}"
              _fsi_statefile_rel="$_fsi_rel/STATE.md"
              if is_non_init "$_fsi_wsdir/STATE.md"; then
                echo "::notice::$_fsi_rel : non initialisé (D-02 amendée, frontmatter réduit à workstream:+created:), jamais compté comme écart (D-06)"
                if ws_has_content "$_fsi_wsdir"; then
                  echo "::notice::$_fsi_rel : AMBIGUITE-D02 — frontmatter nominal MAIS du contenu existe à côté (ROADMAP.md / REQUIREMENTS.md / phases/). DEUX lectures sont possibles et AUCUNE n'est choisie ici : (i) compartiment NEUF alimenté par carve-out ; (ii) compartiment TRAVAILLÉ dont le STATE.md a été TRONQUÉ en plein cycle d'écriture. Les deux ont la même signature sur disque. Ceci est une NOTICE, PAS un échec — à lever à la main."
                fi
                continue
              fi
              _fsi_rc2=0
              _fsi_out="$(bash plugin/conductor/scripts/check-state-integrity.sh --path "$lab_root_abs" --file "$_fsi_statefile_rel" 2>&1)" || _fsi_rc2=$?
              echo "== check-state-integrity $_fsi_rel : rc=$_fsi_rc2 =="; printf '%s\n' "$_fsi_out"
              case "$_fsi_rc2" in
                0) : ;;
                3)
                  # CONSOMMATION DU SIGNAL produit par le plan 41.1-09 (d'où le depends_on).
                  # 3 = conforme SOUS RÉSERVE : l'Invariant 1 (non-régression des compteurs,
                  # ADR-063) a été SAUTÉ faute de baseline à HEAD. Ce N'EST PAS un écart — le faire
                  # échouer rougirait sur TOUT compartiment neuf et casserait l'invariant à trois
                  # états de D-02. Ce qui change : ne juger QUE le code de sortie laissait
                  # l'annonce du gate sur stderr SEULEMENT, donc INVISIBLE AU VERDICT.
                  echo "::notice::$_fsi_rel : INVARIANT1-SAUTE — conforme SOUS RÉSERVE, aucune baseline à HEAD (compartiment absent de HEAD ?). Seul l'Invariant 2 (compte de lignes '^Phase:') a été vérifié. Ceci est une NOTICE, PAS un écart."
                  ;;
                *)
                  _fsi_note "$_fsi_rel : rc=$_fsi_rc2, attendu 0 (conforme), 3 (Invariant 1 sauté) ou non-initialisé détecté en amont par is_non_init"
                  ;;
              esac
            done <<< "$_fsi_ws_list"
            [ "$_fsi_n" -ge 1 ] || { echo "::error::aucun compartiment énuméré — vérité vide"; return 1; }
            echo "== BILAN check-state-integrity ($lab_root_abs) : $_fsi_fail écart(s) sur $_fsi_n compartiment(s) =="
            [ "$_fsi_fail" -eq 0 ]
          }

          # R5a — BASCULE FIXTURE (QUAL-01) : sans elle, les deux branches RÉELLES de ce dépôt
          # (`fiabilite` conforme, `gouvernance` non-initialisé) sont toutes DEUX vertes et R5 ne
          # porterait aucune assertion capable de rougir. Fixture COMMITÉE conforme, puis mutation
          # du WORKING TREE, jamais un état cassé commité directement.
          T5=$(mktemp -d)
          SAIN_FM='---
          gsd_state_version: 1.0
          milestone: m1
          current_phase: 1
          status: executing
          progress:
            total_phases: 1
            completed_phases: 0
            total_plans: 1
            completed_plans: 0
          ---
          Phase: 1'
          git -C "$T5" init -q
          mkdir -p "$T5/.planning/workstreams/sain" "$T5/.planning/workstreams/candidat"
          printf '%s\n' "$SAIN_FM" > "$T5/.planning/workstreams/sain/STATE.md"
          printf '%s\n' "$SAIN_FM" > "$T5/.planning/workstreams/candidat/STATE.md"
          git -C "$T5" add -A
          git -C "$T5" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture-saine-r5"
          cat > "$T5/.planning/workstreams/candidat/STATE.md" <<'EOF'
          ---
          workstream: candidat
          created: "2026-09-23"
          milestone: ""
          ---
          Phase: 1
          EOF
          rc=0
          fanout_check_state_integrity "$T5" >"$T5/r5out1" 2>&1 || rc=$?
          cat "$T5/r5out1"
          echo "== R5a bascule fixture (candidat cassé, non commité) : rc=$rc =="
          if [ "$rc" -ne 1 ]; then
            note "R5a : bascule fixture n'a pas rougi comme attendu (rc=$rc, attendu 1) — QUAL-01 non prouvée"
          fi
          if ! grep -q 'candidat' "$T5/r5out1"; then
            note "R5a : le compartiment fautif « candidat » n'est pas nommé dans le verdict"
          fi
          # bascule inverse : réparé à l'identique du commit -> doit reverdir
          printf '%s\n' "$SAIN_FM" > "$T5/.planning/workstreams/candidat/STATE.md"
          rc=0
          fanout_check_state_integrity "$T5" >"$T5/r5out1b" 2>&1 || rc=$?
          echo "== R5a' fixture réparée : rc=$rc =="
          if [ "$rc" -ne 0 ]; then
            note "R5a' : rc=$rc, attendu 0 — réparé à l'identique du commit, la fixture doit reverdir"
            cat "$T5/r5out1b"
          fi
          rm -rf "$T5"

          # R5 — CHECKOUT RÉEL : chaque compartiment présent est mesuré, aucun nom en dur.
          # `gouvernance` (non-initialisé, D-06) n'y compte JAMAIS comme écart.
          R5TMP=$(mktemp -d)
          rc=0
          fanout_check_state_integrity "." >"$R5TMP/r5out2" 2>&1 || rc=$?
          cat "$R5TMP/r5out2"
          echo "== R5 check-state-integrity racine (fan-out par compartiment énuméré) : rc=$rc =="
          if [ "$rc" -ne 0 ]; then
            note "R5 check-state-integrity racine : rc=$rc, attendu 0 — $(awk '/^== BILAN check-state-integrity/{l=$0} END{print l}' "$R5TMP/r5out2")"
          fi
          rm -rf "$R5TMP"

          rc=0
          out="$(env -u GSD_WORKSTREAM -u VF_WORKSTREAM -u VF_BOOTSTRAP_WORKSTREAM \
            bash plugin/dev-orchestrator/scripts/check-dev-bootstrap.sh --path . 2>/dev/null)" || rc=$?
          echo "== R6 check-dev-bootstrap racine (compartiment fiabilite résolu par défaut) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 3 ] || note "R6 check-dev-bootstrap racine : rc=$rc, attendu 3 (orientation gsd-engine, même famille que le cas GSD_WORKSTREAM=dev du BLOC 1)"
          case "$out" in
            *"[bootstrap]"*"feuille de route absente"*) note "R6 check-dev-bootstrap racine : signal [bootstrap] « feuille de route absente » — le compartiment fiabilite n'a pas été résolu par défaut" ;;
          esac

          # ═══ BILAN UNIQUE — aucun `|| true` sur une invocation de gate, aucun écart toléré ═══
          echo "== BILAN : $fail écart(s) sur 6 verdicts partitionnés (BLOC 1) + 3 verdicts flat (2a) + 3 verdicts racine (2b) =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== gates workstream VERTS : la partition synthétique est vue, discriminante, la fixture flat reste silencieuse, et la racine réelle est conforme =="

      - name: check-divergence.sh en CI (C17, 2026-09-10) — mutation rouge sur fixture divergente, pas seulement présence du gate
        # POURQUOI CETTE ÉTAPE EXISTE (arbitrage Samuel, 2026-09-10, C17 revisité — plan 39-01,
        # Task 3). Le hook `post-merge` (plan 39-01, Task 1) est opt-in et LOCAL — il ne tourne
        # JAMAIS sur une PR fusionnée depuis GitHub, la voie de fusion DOMINANTE de ce dépôt. Un
        # gate correct mais qui ne se déclenche jamais sur le cas qui compte est exactement le mode
        # d'échec « sûr mais inerte » d'ADR-059 (la raison pour laquelle `isolation: worktree` est
        # restée désarmée après la Phase 35) — ce dépôt a déjà payé une fois pour un mécanisme
        # juste-mais-inerte, il ne paie pas deux fois. `check-divergence.sh` lui-même est inchangé ;
        # seule son EXPOSITION en CI est neuve.
        #
        # Étape à part, jamais fusionnée dans l'étape précédente : un échec ici se lit sans
        # ambiguïté comme « check-divergence » dans le journal CI, pas noyé dans le tally d'un autre
        # step.
        run: |
          set -eu

          fail=0
          note() { echo "::error::check-divergence CI : $1"; fail=$((fail + 1)); }

          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          # --- 1. Fixture PROPRE, partitionnée, un seul numéro de phase enregistré ---------------
          mkdir -p "$FIX/.planning/workstreams/alpha/phases/VFDO-05-x-registered"
          echo stub > "$FIX/.planning/workstreams/alpha/phases/VFDO-05-x-registered/PLAN.md"
          printf '%s\n' "### Phase 05: registered" > "$FIX/.planning/workstreams/alpha/ROADMAP.md"
          printf '%s\n' "---" "progress:" "  completed_phases: 0" "---" > "$FIX/.planning/workstreams/alpha/STATE.md"

          # --- 1bis. DEUX compartiments supplémentaires, dans la MÊME fixture (WSAW-03/D-05).
          #     Ils sont créés AVANT le `git add` UNIQUE ci-dessous : aucun ajout partiel, sinon
          #     `check-divergence.sh` serait aveugle à la casse du troisième (T-41.1-12).
          #     Ni `beta` ni `gamma` n'est nommé AILLEURS dans ce fichier — ni dans une liste de
          #     compartiments à vérifier, ni dans une condition. Leur seule présence sur le disque
          #     de la fixture suffit à ce qu'ils soient inspectés : C'EST la preuve WSAW-04, pas une
          #     assertion supplémentaire à écrire. -------------------------------------------------
          mkdir -p "$FIX/.planning/workstreams/beta/phases/VFDO-02-x-registered"
          echo stub > "$FIX/.planning/workstreams/beta/phases/VFDO-02-x-registered/PLAN.md"
          printf '%s\n' "### Phase 02: registered" > "$FIX/.planning/workstreams/beta/ROADMAP.md"

          mkdir -p "$FIX/.planning/workstreams/gamma/phases/VFDO-09-x-registered"
          echo stub > "$FIX/.planning/workstreams/gamma/phases/VFDO-09-x-registered/PLAN.md"
          printf '%s\n' "### Phase 09: registered" > "$FIX/.planning/workstreams/gamma/ROADMAP.md"

          # check-divergence.sh exige un dépôt git (--show-toplevel) — même contrainte que
          # check-state-integrity.sh dans l'étape précédente.
          git -C "$FIX" init -q
          git -C "$FIX" add .planning
          git -C "$FIX" -c user.email=ci@vibeflow.invalid -c user.name=CI -c commit.gpgsign=false \
            commit -q -m "fixture-saine"

          rc=0
          out="$(bash plugin/conductor/scripts/check-divergence.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 1/5 fixture propre (3 compartiments : alpha, beta, gamma) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "1/5 fixture propre : rc=$rc, attendu 0 (conforme, 3 compartiments)"

          # --- 2. MUTATION du TROISIÈME compartiment (`gamma`), sur la MÊME fixture, sans la
          #        reconstruire : deuxième dossier de phase partageant le même préfixe numérique
          #        (shape S2/orphan). `alpha` et `beta` restent CONFORMES à côté — leur conformité
          #        ne doit pas masquer la casse de `gamma`. ------------------------------------------
          mkdir -p "$FIX/.planning/workstreams/gamma/phases/VFDO-09-y-orphan"
          echo stub > "$FIX/.planning/workstreams/gamma/phases/VFDO-09-y-orphan/PLAN.md"

          rc=0
          out="$(bash plugin/conductor/scripts/check-divergence.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 2/5 fixture MUTÉE (gamma cassé, alpha/beta intacts) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || note "2/5 : rc=$rc, attendu 1 (S2 sur gamma ; alpha/beta conformes n'y font pas obstacle)"
          case "$out" in
            *"gamma"*) : ;;
            *) note "2/5 : le compartiment fautif « gamma » n'est pas nommé dans le verdict" ;;
          esac

          # --- 3. RÉPARATION EN PLACE du troisième compartiment (dossier orphelin retiré) — la
          #        bascule INVERSE exigée par le ROADMAP. Sans elle, une preuve rouge seule ne
          #        distingue pas « sait détecter » de « rend toujours 1 par accident ». ------------
          rm -rf "$FIX/.planning/workstreams/gamma/phases/VFDO-09-y-orphan"

          rc=0
          out="$(bash plugin/conductor/scripts/check-divergence.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 3/5 fixture RÉPARÉE (gamma revenu conforme) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "3/5 : rc=$rc, attendu 0 (bascule inverse : cassé → réparé doit revenir vert)"

          # --- 4. MUTATION EN PLACE de la MÊME fixture (jamais reconstruite) : deuxième dossier ---
          #        partageant le même préfixe numérique — le shape orphan/S2 déjà prouvé au Task 1.
          #        ASSERTION PRÉEXISTANTE, INCHANGÉE sur le fond (seul son numéro bouge) : elle
          #        tourne désormais AU MILIEU d'une fixture à trois compartiments, et doit continuer
          #        de rougir sur `alpha`.
          mkdir -p "$FIX/.planning/workstreams/alpha/phases/VFDO-05-y-orphan"
          echo stub > "$FIX/.planning/workstreams/alpha/phases/VFDO-05-y-orphan/PLAN.md"

          rc=0
          out="$(bash plugin/conductor/scripts/check-divergence.sh --path "$FIX" 2>&1)" || rc=$?
          echo "== 4/5 fixture MUTÉE (même arbre, dossier dupliqué ajouté sur alpha) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || note "4/5 fixture mutée : rc=$rc, attendu 1 (S2, divergence détectée) — le step ne serait pas discriminant en CI réelle non plus"

          rm -rf "$FIX"

          # --- 3. Racine : ce dépôt est maintenant partitionné, conforme par construction si la
          #        partition tient. CHANGÉ le 2026-09-23 (partition D-02, mandat worker
          #        `partition-planning-d02`) : avant la migration, la racine n'était pas
          #        partitionnée et le gate y restait silencieux (rc=3) — c'est l'ancienne
          #        assertion. Depuis la migration, la racine expose deux compartiments
          #        (`fiabilite`/`gouvernance`) et le gate doit désormais s'y prononcer CONFORME
          #        (rc=0, aucun signal S2/S4/S5), au même titre que le point 1/5 sur la fixture
          #        propre.
          rc=0
          out="$(bash plugin/conductor/scripts/check-divergence.sh --path . 2>&1)" || rc=$?
          echo "== 5/5 racine (checkout CI, partitionnée par défaut) : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "5/5 racine : rc=$rc, attendu 0 (dépôt partitionné conforme, aucun signal S2/S4/S5)"

          echo "== BILAN check-divergence CI : $fail écart(s) sur 5 verdicts (3 compartiments propres, gamma cassé, gamma réparé, alpha muté, racine) =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-divergence.sh VERT en CI : le flip 0 → 1 sur mutation réelle est prouvé, la racine n'a pas bougé =="

      - name: check-baseline-arbitrage (G-1, PROT-04 — hausse de baseline sans arbitrage cité)
        # POURQUOI CETTE ÉTAPE EXISTE. G-1 traite O-3 du `25-SECURITY.md` (T-25-16, restée
        # procédurale) faute d'accès admin sur ce dépôt (option (a), arbitrage Samuel,
        # AskUserQuestion session principale, 2026-09-17) : elle rend visible et trace toute hausse
        # de la colonne INSTRUCTIONS de `.planning/instruction-budget-baselines.tsv`, ou toute
        # neutralisation d'une sentinelle `.planning/.*-armed`, sans citation d'arbitrage conforme
        # dans le commit qui porte le changement. LIMITE DE FOND : la garde vit dans le dépôt — la PR
        # qu'elle juge peut la modifier (elle, sa suite, cette étape) et rester verte. Elle rend
        # visible et trace, elle ne verrouille rien ; O-3 devient « signalée et tracée », jamais
        # « fermée ». Une étape qui se contenterait de mesurer le dépôt réel serait verte par
        # construction si elle perdait sa capacité à discriminer — la bascule isolée ci-dessous, sur
        # dépôt jetable reconstruit à chaque fois, existe pour que cette étape prouve elle-même
        # qu'elle sait encore rendre rouge, patron `check-instruction-budget` (plus haut dans ce même
        # job). SIX bascules isolées, chacune sur un dépôt jetable reconstruit depuis zéro par
        # write_base() — une seule mutation à la fois, jamais cumulée (plan 41-14 Task 3).
        # FORMULE CANONIQUE (sonde de limite de fond, check-aucune-fermeture.sh, plan 41-15, mandat
        # élargi du manager de mission, 2026-09-17) : cette étape et la garde qu'elle invoque peuvent
        # être modifiée par la PR qu'elle juge — reprise ici mot pour mot pour que la sonde ne
        # signale plus ce fichier comme muet sur sa propre limite de fond.
        run: |
          set -eu

          S="scripts/check-baseline-arbitrage.sh"
          fail=0
          note() { echo "::error::check-baseline-arbitrage CI : $1"; fail=$((fail + 1)); }

          # --- Résolution de la ref de référence pour le journal, remédiation nommée si absente -----
          REF=""
          for r in refs/remotes/origin/main origin/main refs/heads/main main; do
            if git rev-parse --verify -q "${r}^{commit}" >/dev/null 2>&1; then REF="$r"; break; fi
          done
          if [ -z "$REF" ]; then
            echo "::warning::check-baseline-arbitrage CI : aucune ref main résoluble localement, git fetch origin main (remédiation nommée, jamais un repli silencieux)"
            git fetch origin main:refs/remotes/origin/main
            REF="refs/remotes/origin/main"
          fi
          echo "== check-baseline-arbitrage : ref de référence pour le journal = $REF =="

          # --- Bloc 1 — SIX bascules ISOLÉES sur dépôt jetable, chacune reconstruite depuis zéro ----
          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          git_id() { git -C "$FIX" -c user.name=CI -c user.email=ci@vibeflow.invalid -c commit.gpgsign=false "$@"; }

          write_base() {
            rm -rf "$FIX"
            mkdir -p "$FIX/.planning" "$FIX/demo"
            git init -q -b main "$FIX"
            {
              printf '%s\n' '# baseline de fixture CI'
              printf 'demo/a.md\t10\t5\n'
            } > "$FIX/.planning/instruction-budget-baselines.tsv"
            : > "$FIX/.planning/.instruction-budget-armed"
            printf 'contenu a\n' > "$FIX/demo/a.md"
            git_id add -A
            git_id commit -q -m "fixture: état initial"
          }

          # 1/6 dépôt conforme, plage non vide → attendu 0
          write_base
          B1="$(git_id rev-parse HEAD)"
          git_id commit -q --allow-empty -m "chore: rien ne change"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B1" 2>&1)" || rc=$?
          echo "== 1/6 fixture conforme : rc=$rc =="; printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || note "1/6 fixture conforme : rc=$rc, attendu 0"

          # 2/6 hausse d'INSTRUCTIONS sans citation → attendu 1, HAUSSE-SANS-ARBITRAGE
          write_base
          B2="$(git_id rev-parse HEAD)"
          { printf '%s\n' '# baseline de fixture CI'; printf 'demo/a.md\t10\t9\n'; } > "$FIX/.planning/instruction-budget-baselines.tsv"
          git_id add -A
          git_id commit -q -m "hausse instructions sans citation"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B2" 2>&1)" || rc=$?
          echo "== 2/6 hausse instructions sans citation : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *HAUSSE-SANS-ARBITRAGE*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "2/6 hausse instructions sans citation : rc=$rc (attendu 1), HAUSSE-SANS-ARBITRAGE=$has (attendu 1)"; fi

          # 3/6 hausse de la seule colonne LIGNES, sans citation → attendu 0, AVERTISSEMENT-LIGNES-EN-HAUSSE,
          #     jamais de verdict de hausse bloquante (D-02/D-H6 : colonne informative)
          write_base
          B3="$(git_id rev-parse HEAD)"
          { printf '%s\n' '# baseline de fixture CI'; printf 'demo/a.md\t15\t5\n'; } > "$FIX/.planning/instruction-budget-baselines.tsv"
          git_id add -A
          git_id commit -q -m "hausse lignes seule sans citation"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B3" 2>&1)" || rc=$?
          echo "== 3/6 hausse lignes seule : rc=$rc =="; printf '%s\n' "$out"
          hasw=0; case "$out" in *AVERTISSEMENT-LIGNES-EN-HAUSSE*) hasw=1 ;; esac
          hasb=0; case "$out" in *HAUSSE-SANS-ARBITRAGE*|*HAUSSE-NON-IMPUTABLE*) hasb=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$hasw" -ne 1 ] || [ "$hasb" -ne 0 ]; then note "3/6 hausse lignes seule : rc=$rc (attendu 0), AVERTISSEMENT-LIGNES-EN-HAUSSE=$hasw (attendu 1), verdict bloquant présent=$hasb (attendu 0)"; fi

          # 4/6 sentinelle .planning/.instruction-budget-armed supprimée sans citation → attendu 1,
          #     SENTINELLE-NEUTRALISEE
          write_base
          B4="$(git_id rev-parse HEAD)"
          rm -f "$FIX/.planning/.instruction-budget-armed"
          git_id add -A
          git_id commit -q -m "retire la sentinelle armed sans citation"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B4" 2>&1)" || rc=$?
          echo "== 4/6 sentinelle retirée : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *SENTINELLE-NEUTRALISEE*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "4/6 sentinelle retirée : rc=$rc (attendu 1), SENTINELLE-NEUTRALISEE=$has (attendu 1)"; fi

          # 5/6 ligne de baseline retirée, TROIS volets comptés comme UNE bascule (règle finale du
          #     manager, 2026-09-17) : cible présente sans citation → 1 ; cible présente avec
          #     citation conforme → 0 ; cible également disparue de l'arbre → 0
          write_base
          B5A="$(git_id rev-parse HEAD)"
          printf '%s\n' '# baseline de fixture CI' > "$FIX/.planning/instruction-budget-baselines.tsv"
          git_id add -A
          git_id commit -q -m "retire a.md de la baseline sans citation, fichier reste"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B5A" 2>&1)" || rc=$?
          echo "== 5a/6 ligne retirée, cible présente, sans citation : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *LIGNE-RETIREE-CIBLE-PRESENTE-SANS-ARBITRAGE*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "5a/6 ligne retirée cible présente sans citation : rc=$rc (attendu 1), verdict=$has (attendu 1)"; fi

          write_base
          B5B="$(git_id rev-parse HEAD)"
          printf '%s\n' '# baseline de fixture CI' > "$FIX/.planning/instruction-budget-baselines.tsv"
          git_id add -A
          MSG5B="$(printf '%s\n\n%s\n' 'retire a.md de la baseline, fichier conservé' 'arbitrage Samuel, AskUserQuestion session principale, 2026-09-17')"
          git_id commit -q -m "$MSG5B"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B5B" 2>&1)" || rc=$?
          echo "== 5b/6 ligne retirée, cible présente, avec citation : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *AVERTISSEMENT-LIGNE-RETIREE-ARBITREE*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "5b/6 ligne retirée cible présente avec citation : rc=$rc (attendu 0), verdict=$has (attendu 1)"; fi

          write_base
          B5C="$(git_id rev-parse HEAD)"
          printf '%s\n' '# baseline de fixture CI' > "$FIX/.planning/instruction-budget-baselines.tsv"
          rm -f "$FIX/demo/a.md"
          git_id add -A
          git_id commit -q -m "retire a.md de la baseline et du dépôt, sans citation (cible disparue)"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B5C" 2>&1)" || rc=$?
          echo "== 5c/6 ligne retirée, cible disparue : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *AVERTISSEMENT-LIGNE-RETIREE-CIBLE-DISPARUE*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "5c/6 ligne retirée cible disparue : rc=$rc (attendu 0), verdict=$has (attendu 1)"; fi

          # 6/6 --base-ref égal à HEAD → attendu 3, PLAGE-VIDE
          write_base
          H6="$(git_id rev-parse HEAD)"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$H6" 2>&1)" || rc=$?
          echo "== 6/6 base-ref égal à HEAD : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *PLAGE-VIDE*) has=1 ;; esac
          if [ "$rc" -ne 3 ] || [ "$has" -ne 1 ]; then note "6/6 base-ref égal à HEAD : rc=$rc (attendu 3), PLAGE-VIDE=$has (attendu 1)"; fi

          rm -rf "$FIX"

          echo "== BILAN preuve fixture : $fail écart(s) sur 6 verdicts =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-baseline-arbitrage DISCRIMINANT en CI : les six bascules isolées sont prouvées, dont la colonne lignes non bloquante et les trois volets du retrait de ligne =="

          # --- Bloc 2 — Mesure du dépôt réel ------------------------------------------------------
          rc=0
          out="$(bash "$S" 2>&1)" || rc=$?
          echo "== dépôt réel : rc=$rc =="; printf '%s\n' "$out"
          case "$rc" in
            0|3) : ;;
            *)
              verdict="$(printf '%s\n' "$out" | tail -1)"
              echo "::error::check-baseline-arbitrage : dépôt réel rc=$rc — verdict : $verdict"
              exit 1
              ;;
          esac

      - name: check-gate-touche (G-2, PROT-05 — la PR modifie ce qui la juge)
        # POURQUOI CETTE ÉTAPE EXISTE. G-2 traite la seconde phrase d'O-3 du `25-SECURITY.md` :
        # une même PR peut modifier le gate, sa suite et l'étape CI, et rester verte — faute
        # d'accès admin (option (a), arbitrage Samuel, AskUserQuestion session principale,
        # 2026-09-17), rien côté GitHub ne peut l'en empêcher. La garde ne verrouille rien : elle
        # exige un marqueur déclaratif `Gate-Touche: <chemin-ou-motif> — <raison>` dans un commit
        # non-merge de la branche qui touche la surface de gate (cinq classes : gates et suites
        # `plugin/conductor/scripts/` et `scripts/`, `.github/workflows/ci.yml`, `scripts/hooks/`).
        # LIMITE DE FOND (formule canonique, sonde `check-aucune-fermeture.sh`, plan 41-15) :
        # cette étape et la garde qu'elle invoque peuvent être modifiée par la PR qu'elle juge —
        # reprise ici mot pour mot pour que la sonde ne signale plus ce fichier comme muet sur sa
        # propre limite de fond. QUATRE bascules isolées (plan 41-16, Task 3), chacune sur un
        # dépôt jetable reconstruit DEPUIS ZÉRO par write_base() — une mutation à la fois, jamais
        # cumulée, patron check-baseline-arbitrage (plus haut dans ce même job).
        run: |
          set -eu

          S="scripts/check-gate-touche.sh"
          fail=0
          note() { echo "::error::check-gate-touche CI : $1"; fail=$((fail + 1)); }

          # --- Résolution de la ref de référence pour le journal, remédiation nommée si absente --
          REF=""
          for r in refs/remotes/origin/main origin/main refs/heads/main main; do
            if git rev-parse --verify -q "${r}^{commit}" >/dev/null 2>&1; then REF="$r"; break; fi
          done
          if [ -z "$REF" ]; then
            echo "::warning::check-gate-touche CI : aucune ref main résoluble localement, git fetch origin main (remédiation nommée, jamais un repli silencieux)"
            git fetch origin main:refs/remotes/origin/main
            REF="refs/remotes/origin/main"
          fi
          echo "== check-gate-touche : ref de référence pour le journal = $REF =="

          # --- QUATRE bascules ISOLÉES sur dépôt jetable, chacune reconstruite depuis zéro --------
          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          git_id() { git -C "$FIX" -c user.name=CI -c user.email=ci@vibeflow.invalid -c commit.gpgsign=false "$@"; }

          write_base() {
            rm -rf "$FIX"
            mkdir -p "$FIX/scripts"
            git init -q -b main "$FIX"
            printf 'echo demo\n' > "$FIX/scripts/check-demo.sh"
            git_id add -A
            git_id commit -q -m "fixture: état initial"
          }

          # 1/4 chemin de surface touché et couvert par un trailer conforme → attendu rc 0
          write_base
          B1="$(git_id rev-parse HEAD)"
          printf 'echo demo v2\n' > "$FIX/scripts/check-demo.sh"
          git_id add -A
          MSG1="$(printf '%s\n\n%s\n' 'modifie le gate demo, couvert' 'Gate-Touche: scripts/check-demo.sh — bascule 1/4 de la preuve CI, chemin couvert')"
          git_id commit -q -m "$MSG1"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B1" 2>&1)" || rc=$?
          echo "== 1/4 chemin surface couvert : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *DECLARE*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "1/4 chemin surface couvert : rc=$rc (attendu 0), DECLARE=$has (attendu 1)"; fi

          # 2/4 chemin de surface touché sans trailer → attendu rc 1, CHEMIN-NON-DECLARE
          write_base
          B2="$(git_id rev-parse HEAD)"
          printf 'echo demo v2\n' > "$FIX/scripts/check-demo.sh"
          git_id add -A
          git_id commit -q -m "modifie le gate demo sans trailer"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B2" 2>&1)" || rc=$?
          echo "== 2/4 chemin surface sans trailer : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *CHEMIN-NON-DECLARE*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "2/4 chemin surface sans trailer : rc=$rc (attendu 1), CHEMIN-NON-DECLARE=$has (attendu 1)"; fi

          # 3/4 trailer présent mais sans séparateur ni raison → attendu rc 1, MARQUEUR-MAL-FORME
          write_base
          B3="$(git_id rev-parse HEAD)"
          printf 'echo demo v2\n' > "$FIX/scripts/check-demo.sh"
          git_id add -A
          MSG3="$(printf '%s\n\n%s\n' 'modifie le gate demo, trailer casse' 'Gate-Touche: scripts/check-demo.sh sans separateur du tout dans cette ligne')"
          git_id commit -q -m "$MSG3"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B3" 2>&1)" || rc=$?
          echo "== 3/4 trailer sans séparateur : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *MARQUEUR-MAL-FORME*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "3/4 trailer sans séparateur : rc=$rc (attendu 1), MARQUEUR-MAL-FORME=$has (attendu 1)"; fi

          # 4/4 seul un chemin hors surface touché → attendu rc 3, RIEN-A-JUGER
          write_base
          B4="$(git_id rev-parse HEAD)"
          printf 'contenu\n' > "$FIX/README.md"
          git_id add -A
          git_id commit -q -m "touche readme seul, hors surface"
          rc=0
          out="$(bash "$S" --root "$FIX" --base-ref "$B4" 2>&1)" || rc=$?
          echo "== 4/4 hors surface seul : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *RIEN-A-JUGER*) has=1 ;; esac
          if [ "$rc" -ne 3 ] || [ "$has" -ne 1 ]; then note "4/4 hors surface seul : rc=$rc (attendu 3), RIEN-A-JUGER=$has (attendu 1)"; fi

          rm -rf "$FIX"

          echo "== BILAN preuve fixture : $fail écart(s) sur 4 verdicts =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-gate-touche DISCRIMINANT en CI : les quatre bascules isolées sont prouvées, l'étape sait rougir sur chacun de ses trois verdicts bloquants/non bloquants =="

          # --- Mesure du dépôt réel ---------------------------------------------------------------
          rc=0
          out="$(bash "$S" 2>&1)" || rc=$?
          echo "== dépôt réel : rc=$rc =="; printf '%s\n' "$out"
          case "$rc" in
            0|3) : ;;
            *)
              verdict="$(printf '%s\n' "$out" | tail -1)"
              echo "::error::check-gate-touche : dépôt réel rc=$rc — verdict : $verdict"
              exit 1
              ;;
          esac

      - name: check-affirmation-non-mesuree (G-4 — affirmation de prose non mesurée)
        # POURQUOI CETTE ÉTAPE EXISTE. La PR #90 a écrit dans `CLAUDE.md` que « le serveur refuse
        # le push direct » et que « toute mise à jour de `main` passe par une PR », au présent de
        # l'indicatif — alors que `gh api repos/picmakpro/vibeflow-os/rulesets` rendait `[]` au
        # même moment : rien ne comparait une affirmation de prose à l'état réel du serveur. G-4
        # interdit qu'un fichier porteur (CLAUDE.md, docs/ADR.md, README.md, README.fr.md,
        # manual/**/*.md) affirme, au présent et sans qualificateur, une protection serveur que la
        # mesure versionnée (`.planning/server-rulesets-measurement.json`, écrite par
        # `scripts/measure-server-rulesets.sh`, JAMAIS interrogée en réseau par la garde
        # elle-même) ne confirme pas ou ne confirme plus (périmée). LIMITE DE FOND, comme G-1/G-2/
        # G-3 : la garde vit dans le dépôt, vérifie la forme jamais la véracité, ne verrouille
        # rien — la PR qu'elle juge peut la modifier et rester verte. CINQ bascules isolées,
        # chacune sur un dépôt jetable reconstruit depuis zéro, patron `check-gate-touche` /
        # `check-baseline-arbitrage` (plus haut dans ce même job), pour que cette étape prouve
        # elle-même qu'elle sait encore rendre chacun de ses quatre verdicts.
        run: |
          set -eu

          S="scripts/check-affirmation-non-mesuree.sh"
          fail=0
          note() { echo "::error::check-affirmation-non-mesuree CI : $1"; fail=$((fail + 1)); }

          FIX="$(mktemp -d)"
          trap 'rm -rf "$FIX"' EXIT

          git_id() { git -C "$FIX" -c user.name=CI -c user.email=ci@vibeflow.invalid -c commit.gpgsign=false "$@"; }

          write_repo() {  # <corps CLAUDE.md> [<mesure JSON ou vide>]
            rm -rf "$FIX"
            mkdir -p "$FIX/.planning"
            git init -q -b main "$FIX"
            printf '%s\n' "$1" > "$FIX/CLAUDE.md"
            if [ -n "${2:-}" ]; then printf '%s\n' "$2" > "$FIX/.planning/server-rulesets-measurement.json"; fi
            git_id add -A
            git_id commit -q -m "fixture: état initial"
          }

          FRAICHE_CONFIRME="{\"measured_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"repo\": \"o/r\", \"ruleset_count\": 1, \"active_count\": 1, \"rulesets\": [{\"id\":1,\"enforcement\":\"active\"}]}"
          FRAICHE_CONTREDIT="{\"measured_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"repo\": \"o/r\", \"ruleset_count\": 0, \"active_count\": 0, \"rulesets\": []}"
          PERIMEE_CONFIRME='{"measured_at": "2020-01-01T00:00:00Z", "repo": "o/r", "ruleset_count": 1, "active_count": 1, "rulesets": [{"id":1,"enforcement":"active"}]}'

          # 1/5 affirmation au présent, sans mesure -> attendu 2, MESURE-ABSENTE-OU-PERIMEE
          write_repo 'Toute mise à jour de `main` passe par une PR (0 approbation).'
          rc=0
          out="$(VF_AFFIRMATION_GATE_CONSULTATIF=0 bash "$S" --root "$FIX" --ref HEAD 2>&1)" || rc=$?
          echo "== 1/5 affirmation sans mesure : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *MESURE-ABSENTE-OU-PERIMEE*) has=1 ;; esac
          if [ "$rc" -ne 2 ] || [ "$has" -ne 1 ]; then note "1/5 affirmation sans mesure : rc=$rc (attendu 2), MESURE-ABSENTE-OU-PERIMEE=$has (attendu 1)"; fi

          # 2/5 même affirmation, mesure fraîche et CONTREDIT (rulesets vides) -> attendu 1, bloquant
          write_repo 'Toute mise à jour de `main` passe par une PR (0 approbation).' "$FRAICHE_CONTREDIT"
          rc=0
          out="$(VF_AFFIRMATION_GATE_CONSULTATIF=0 bash "$S" --root "$FIX" --ref HEAD 2>&1)" || rc=$?
          echo "== 2/5 affirmation contredite par mesure fraîche : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *AFFIRMATION-CONTREDITE-PAR-MESURE*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "2/5 affirmation contredite : rc=$rc (attendu 1), AFFIRMATION-CONTREDITE-PAR-MESURE=$has (attendu 1)"; fi

          # 3/5 même phrase QUALIFIÉE ("à la pose") -> attendu 0, licite quelle que soit la mesure
          write_repo 'À la pose, toute mise à jour de `main` passe par une PR (0 approbation).'
          rc=0
          out="$(VF_AFFIRMATION_GATE_CONSULTATIF=0 bash "$S" --root "$FIX" --ref HEAD 2>&1)" || rc=$?
          echo "== 3/5 affirmation qualifiée : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *AVERTISSEMENT-AFFIRMATION-QUALIFIEE*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "3/5 affirmation qualifiée : rc=$rc (attendu 0), AVERTISSEMENT-AFFIRMATION-QUALIFIEE=$has (attendu 1)"; fi

          # 4/5 affirmation adossée à une mesure fraîche qui la CONFIRME -> attendu 0, licite
          write_repo 'Toute mise à jour de `main` passe par une PR (0 approbation).' "$FRAICHE_CONFIRME"
          rc=0
          out="$(VF_AFFIRMATION_GATE_CONSULTATIF=0 bash "$S" --root "$FIX" --ref HEAD 2>&1)" || rc=$?
          echo "== 4/5 affirmation confirmée par mesure fraîche : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *AVERTISSEMENT-AFFIRMATION-CONFIRMEE-PAR-MESURE*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "4/5 affirmation confirmée : rc=$rc (attendu 0), AVERTISSEMENT-AFFIRMATION-CONFIRMEE-PAR-MESURE=$has (attendu 1)"; fi

          # 5/5 mesure PÉRIMÉE (horodatage figé dans le passé) avec affirmation présente -> attendu 2
          write_repo 'Toute mise à jour de `main` passe par une PR (0 approbation).' "$PERIMEE_CONFIRME"
          rc=0
          out="$(VF_AFFIRMATION_GATE_CONSULTATIF=0 bash "$S" --root "$FIX" --ref HEAD 2>&1)" || rc=$?
          echo "== 5/5 mesure périmée : rc=$rc =="; printf '%s\n' "$out"
          hasgen=0; case "$out" in *mesure_statut=perimee*) hasgen=1 ;; esac
          if [ "$rc" -ne 2 ] || [ "$hasgen" -ne 1 ]; then note "5/5 mesure périmée : rc=$rc (attendu 2), mesure_statut=perimee=$hasgen (attendu 1)"; fi

          rm -rf "$FIX"

          echo "== BILAN preuve fixture : $fail écart(s) sur 5 verdicts =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-affirmation-non-mesuree DISCRIMINANT en CI : les cinq bascules isolées sont prouvées =="

          # --- Mesure du dépôt réel (les fichiers porteurs à HEAD, la mesure versionnée si présente) -
          # PORTÉE CONSULTATIVE (arbitrage Samuel, session principale, 2026-09-23) : la garde rend 0
          # quoi qu'elle trouve, donc cette étape ne fait JAMAIS échouer le job sur le dépôt réel.
          # Elle remonte un ::warning:: — un gate consultatif qui n'imprimerait qu'au fond du log
          # serait invisible, ce qui est pire qu'absent : « consultatif » veut dire signalé et tracé,
          # pas silencieux. Les cinq bascules ci-dessus forcent VF_AFFIRMATION_GATE_CONSULTATIF=0
          # parce qu'elles mesurent la SÉMANTIQUE DE DÉTECTION (rc 1/2/3) : au défaut consultatif
          # elles rendraient toutes 0 et ne prouveraient plus rien — la preuve par mutation exigée
          # par ADR-074 mourrait avec la bascule.
          rc=0
          out="$(bash "$S" 2>&1)" || rc=$?
          echo "== dépôt réel : rc=$rc =="; printf '%s\n' "$out"
          signale=0
          case "$out" in
            *AFFIRMATION-CONTREDITE-PAR-MESURE*|*MESURE-ABSENTE-OU-PERIMEE*) signale=1 ;;
          esac
          if [ "$signale" -eq 1 ]; then
            verdict="$(printf '%s\n' "$out" | grep -E 'AFFIRMATION-CONTREDITE-PAR-MESURE|MESURE-ABSENTE-OU-PERIMEE' | head -1)"
            echo "::warning::check-affirmation-non-mesuree (G-4, consultatif) : $verdict"
          fi
          if [ "$rc" -eq 3 ]; then
            echo "::warning::check-affirmation-non-mesuree : NÉANT — aucun fichier porteur résolu (misconfiguration, jamais un vert à vide)"
          fi

      - name: check-push-sans-pr (G-3 — preuve par fixture, sans condition)
        # POURQUOI DEUX ÉTAPES. Une étape GitHub Actions ne porte qu'une seule condition. La
        # mesure réelle ne peut tourner que sur un push vers `main` (elle a besoin de GH_TOKEN et
        # d'un sha réellement poussé) — mais une étape conditionnelle `main` est SAUTÉE sur toute
        # PR et toute branche de feature, donc ELLE NE PEUT JAMAIS PROUVER sa capacité à rougir
        # depuis un run de PR. D'où cette étape de fixture, SANS CONDITION : elle tourne sur tout
        # run (PR comme push de branche) et prouve, à chaque exécution, que
        # `scripts/check-push-sans-pr.sh` sait effectivement distinguer ses quatre verdicts —
        # sans jamais appeler le réseau (fixtures `--pulls-file` / `--closed-pulls-file`).
        # ALARME APRÈS COUP, JAMAIS UN VERROU : cette étape ne bloque aucun push direct sur
        # `main` — voir l'en-tête de `scripts/check-push-sans-pr.sh`.
        # QUATRE BASCULES ISOLÉES (plan 41-17, Task 3), chacune sur des fichiers JSON réécrits
        # depuis zéro (patron `check-gate-touche` / `check-baseline-arbitrage`, plus haut dans ce
        # même job) : une mutation de scénario à la fois, jamais cumulée.
        run: |
          set -eu

          S="scripts/check-push-sans-pr.sh"
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT

          fail=0
          note() { echo "::error::check-push-sans-pr CI : $1"; fail=$((fail + 1)); }

          SHA="1111111111111111111111111111111111111111"
          BEFORE="2222222222222222222222222222222222222222"

          # 1/4 première lecture porte une PR -> attendu rc 0, voie=commits-pulls
          printf '[{"number":9}]\n' > "$T/1_pulls.json"
          rc=0
          out="$(bash "$S" --repo o/r --sha "$SHA" --before "$BEFORE" --pulls-file "$T/1_pulls.json" 2>&1)" || rc=$?
          echo "== 1/4 première lecture associée : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *"voie=commits-pulls"*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "1/4 première lecture associée : rc=$rc (attendu 0), voie=commits-pulls=$has (attendu 1)"; fi

          # 2/4 première vide, seconde porte le merge_commit_sha du sha jugé (merge par rebase) -> rc 0
          printf '[]\n' > "$T/2_pulls.json"
          printf '[{"number":11,"merge_commit_sha":"%s"}]\n' "$SHA" > "$T/2_closed.json"
          rc=0
          out="$(bash "$S" --repo o/r --sha "$SHA" --before "$BEFORE" --pulls-file "$T/2_pulls.json" --closed-pulls-file "$T/2_closed.json" 2>&1)" || rc=$?
          echo "== 2/4 merge par rebase (cascade merge_commit_sha) : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *"voie=merge-commit-sha"*) has=1 ;; esac
          if [ "$rc" -ne 0 ] || [ "$has" -ne 1 ]; then note "2/4 merge par rebase : rc=$rc (attendu 0), voie=merge-commit-sha=$has (attendu 1)"; fi

          # 3/4 les deux lectures vides -> attendu rc 1, PUSH-SANS-PR
          printf '[]\n' > "$T/3_pulls.json"
          printf '[]\n' > "$T/3_closed.json"
          rc=0
          out="$(bash "$S" --repo o/r --sha "$SHA" --before "$BEFORE" --pulls-file "$T/3_pulls.json" --closed-pulls-file "$T/3_closed.json" 2>&1)" || rc=$?
          echo "== 3/4 deux lectures vides : rc=$rc =="; printf '%s\n' "$out"
          has=0; case "$out" in *PUSH-SANS-PR*) has=1 ;; esac
          if [ "$rc" -ne 1 ] || [ "$has" -ne 1 ]; then note "3/4 deux lectures vides : rc=$rc (attendu 1), PUSH-SANS-PR=$has (attendu 1)"; fi

          # 4/4 réponse d'erreur d'API au lieu d'un tableau -> attendu rc 2, JAMAIS rc 1
          # (précédent nommé : faux négatif d'auth de la v2.39.0 le 2026-07-26)
          printf '{"message":"Bad credentials"}\n' > "$T/4_pulls.json"
          rc=0
          out="$(bash "$S" --repo o/r --sha "$SHA" --before "$BEFORE" --pulls-file "$T/4_pulls.json" 2>&1)" || rc=$?
          echo "== 4/4 échec d'auth simulé : rc=$rc =="; printf '%s\n' "$out"
          if [ "$rc" -ne 2 ]; then note "4/4 échec d'auth simulé : rc=$rc (attendu 2, jamais 1 — précédent v2.39.0 du 2026-07-26)"; fi

          echo "== BILAN preuve fixture : $fail écart(s) sur 4 verdicts =="
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "== check-push-sans-pr DISCRIMINANT en CI : les quatre bascules isolées sont prouvées, l'étape sait rendre chacun de ses quatre verdicts =="

      - name: check-push-sans-pr (G-3, PROT-05 — mesure réelle sur un push vers main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Seule cette étape porte GH_TOKEN et interroge réellement GitHub — sur un push vers
        # `main` uniquement (même garde que `check-release-tag`, juste après). Sans jeton, le `gh`
        # du runner échoue en auth : lire cet échec comme « aucune PR » serait exactement le faux
        # négatif d'auth vécu sur la v2.39.0 le 2026-07-26 — `check-push-sans-pr.sh` distingue déjà
        # cet échec (rc 2 NON-VERIFIABLE) d'une liste vide (rc 1 PUSH-SANS-PR), jamais confondus.
        # Cette étape est une ALARME APRÈS COUP : le commit qu'elle juge est déjà sur `main`.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rc=0
          out="$(bash scripts/check-push-sans-pr.sh \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --before "${{ github.event.before }}" 2>&1)" || rc=$?
          echo "== mesure réelle : rc=$rc =="; printf '%s\n' "$out"
          case "$rc" in
            0|3) : ;;
            1)
              verdict="$(printf '%s\n' "$out" | tail -1)"
              echo "::error::check-push-sans-pr : PUSH SANS PR ASSOCIÉE sur main — alarme après coup, le commit est déjà arrivé — $verdict"
              exit 1
              ;;
            *)
              verdict="$(printf '%s\n' "$out" | tail -1)"
              echo "::error::check-push-sans-pr : mesure réelle NON-VERIFIABLE rc=$rc — $verdict"
              exit 1
              ;;
          esac

      - name: check-release-tag (main uniquement — VERSION doit être taggée et poussée)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # GH_TOKEN requis : sans lui le gh du runner échoue en auth et le gate lisait cet
        # échec comme « aucune release » (faux négatif, vécu v2.39.0 le 2026-07-26).
        # exit 3 = fenêtre de grâce (ADR-073) : le tag/la release sont posés quelques minutes
        # après le merge, ce job tourne AU merge — un tag absent mais commit récent n'est pas
        # un échec, c'est une attente. Non bloquant : avertissement, job vert.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rc=0
          out="$(bash scripts/check-release-tag.sh --remote 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0) : ;;
            3) echo "::warning::check-release-tag : fenêtre de grâce — $(printf '%s\n' "$out" | tail -1)" ;;
            *) exit "$rc" ;;
          esac

  lab-frais:
    name: Lab frais (install baseline + Gate C — leçon UAT 2026-07-25, F2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la baseline dans un lab vierge avec le vrai engine
        run: |
          set -eu
          LAB="$(mktemp -d)"
          echo "LAB=$LAB" >> "$GITHUB_ENV"
          cd "$LAB" && git init -q
          # La baseline = la fermeture transitive de TOUS les modules `role=mandatory`, dérivée du
          # catalogue. Surtout PAS un nom de module en dur : ce job codait `conductor`, et il n'a
          # tenu que par chance — `consolidator` est devenu mandatory en v1.9.0 et n'arrivait dans
          # ce lab que par l'arête indirecte conductor → validator → consolidator. Le jour où cette
          # arête bouge, la CI testerait une baseline qui n'est plus celle des utilisateurs.
          mandatory=$(cd "$GITHUB_WORKSPACE" \
            && bash plugin/installer/scripts/build-module-catalog.sh 2>/dev/null \
            | awk -F'\t' '$3 == "mandatory" { print $1 }')
          [ -n "$mandatory" ] || { echo "::error::aucun module mandatory au catalogue — baseline vide"; exit 1; }
          echo "== modules mandatory : $(printf '%s' "$mandatory" | tr '\n' ' ') =="
          # xargs, PAS l'expansion non quotée `resolve-deps.sh $mandatory` : le word-splitting sur
          # saut de ligne dépend d'IFS et s'est révélé non fiable à la vérification locale (les deux
          # noms passaient collés en un seul argument, et resolve-deps échouait sur un module
          # inconnu). Idem pour la boucle : `while read`, jamais `for m in $closure`.
          closure=$(cd "$GITHUB_WORKSPACE" \
            && printf '%s\n' "$mandatory" | xargs bash plugin/_internal/resolve-deps.sh | sort -u)
          [ -n "$closure" ] || { echo "::error::fermeture transitive vide"; exit 1; }
          echo "== baseline : $(printf '%s' "$closure" | tr '\n' ' ') =="
          printf '%s\n' "$closure" | while IFS= read -r m; do
            [ -n "$m" ] || continue
            VIBEFLOW_CACHE="$GITHUB_WORKSPACE/plugin" VF_SCOPE=project \
              bash "$GITHUB_WORKSPACE/plugin/_internal/vibeflow-update.sh" install "$m"
          done

      - name: "Gate C du lab frais : la baseline doit passer ses propres gates SANS intervention"
        run: |
          set -eu
          cd "$LAB"
          echo "== check-agents --strict sur les agents installés =="
          bash .claude/scripts/check-agents.sh --strict
          echo "== check-registres --strict (registres canoniques posés ?) =="
          # Exigence DURE, plus de tolérance. L'ancienne forme passait `--allow-empty`, qui convertit
          # « 5 registres canon manquants » (rc=1) en « lab vierge, indéterminé » (rc=3), puis
          # acceptait rc=3 — la CI validait donc un lab SANS mémoire en le prenant pour un lab neuf.
          # C'est ce qui a laissé passer en production des labs où la machinerie mémoire tournait à
          # vide (constaté chez un utilisateur, 2026-08-15). Depuis seed-registres.sh, l'install pose
          # les registres : le seul verdict acceptable est le vert.
          bash .claude/scripts/check-registres.sh --strict
          echo "== les registres canon sont bien instanciés, pas seulement les gabarits =="
          bash .claude/scripts/seed-registres.sh --check
          echo "== hooks de gouvernance présents dans settings.json =="
          grep -q "guard" .claude/settings.json

  # POURQUOI CE JOB EXISTE (Phase 28, ARMD-06/ARMD-08 — as-installed testing, #38). Le job
  # ci-dessus (lab-frais) installe la fermeture de `conductor` (7 modules) : elle ne pose NI le
  # gate `check-capability-activation.sh` NI un seul artefact arme — un gate exerce seulement sur
  # l'arbre source (la suite du module) ne peut donc RIEN prouver sur ce que l'install pose CHEZ
  # L'UTILISATEUR. C'est la faille de fond de #38 : « il verifie que l'install tient, jamais que ce
  # qu'elle pose est coherent avec ce qu'elle a promis » (.planning/ROADMAP.md:2047-2049). Ce job
  # installe donc sa PROPRE fermeture, `dev-orchestrator` (9 modules, la seule fermeture mesuree qui
  # pose a la fois le gate et des artefacts armes), dans son PROPRE lab, sans toucher a une seule
  # ligne de `lab-frais` ni de son Gate C.
  lab-frais-arme:
    name: "Lab frais arme (as-installed testing — le gate installe, sur un univers non vide, #38)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (bash, jq, python3)
        # Ni `gates` ni `lab-frais` n'assertent cet outillage aujourd'hui ; leur présence sur
        # ubuntu-latest est une DÉDUCTION tirée du vert actuel, pas une mesure. Un gate qui sort 2
        # pour outil manquant doit le dire par un message d'assertion, jamais par un diagnostic
        # trompeur venu d'ailleurs.
        run: |
          bash --version | head -1
          jq --version
          python3 --version

      - name: "Installer la fermeture dev-orchestrator (9 modules) dans un lab armé, distinct de $LAB"
        run: |
          set -eu
          LAB_ARME="$(mktemp -d)"
          echo "LAB_ARME=$LAB_ARME" >> "$GITHUB_ENV"
          cd "$LAB_ARME" && git init -q
          closure=$(cd "$GITHUB_WORKSPACE" && bash plugin/_internal/resolve-deps.sh dev-orchestrator)
          echo "== fermeture armée : $closure =="
          # Échec VISIBLE si la fermeture a dérivé et ne contient plus dev-orchestrator : sans cette
          # assertion (awk, jamais grep pipé — le grep de ce poste tronque silencieusement), ce job
          # rendrait vert à vide, exactement le mode d'échec que la phase existe pour fermer.
          if ! printf '%s\n' "$closure" | awk '$0=="dev-orchestrator"{f=1} END{exit !f}'; then
            echo "::error::fermeture résolue sans dev-orchestrator — le gate ne serait pas installé, ce job rendrait vert à vide"
            exit 1
          fi
          for m in $closure; do
            VIBEFLOW_CACHE="$GITHUB_WORKSPACE/plugin" VF_SCOPE=project \
              bash "$GITHUB_WORKSPACE/plugin/_internal/vibeflow-update.sh" install "$m"
          done

      - name: "Doter le lab armé d'une configuration minimale (plafond : trois clés)"
        # Mesuré (Phase 28, plan 03) : un lab installé avec cette fermeture et un
        # .planning/config.json VIDE sort en ÉCART règle 2 sur intel.enabled (toggle INACTIF cité
        # hors marqueur conditionnel dans docs-flow.md) — une règle ÉTRANGÈRE au périmètre de cette
        # phase. Le corpus, l'index et la règle ne sont PAS touchés : seule la clé strictement
        # nécessaire est posée ici. Une seule clé a suffi à la mesure, bien sous le plafond de trois.
        run: |
          set -eu
          mkdir -p "$LAB_ARME/.planning"
          cat > "$LAB_ARME/.planning/config.json" <<'JSON'
          {
            "intel": { "enabled": true }
          }
          JSON

      - name: "Invoquer le gate INSTALLÉ, sans surcharge — un exit 2 échoue comme un exit 1"
        # Aucune surcharge VF_CAPACT_* : la cascade de résolution est exercée telle qu'elle tourne
        # chez l'utilisateur, exactement comme le fait l'invocation nue du job `gates`. Ne JAMAIS
        # invoquer le script depuis $GITHUB_WORKSPACE : tester l'arbre source contre un lab est le
        # geste que le pattern *as-installed testing* condamne, et c'est la confusion qui a produit
        # #38.
        run: |
          set -eu
          cd "$LAB_ARME"
          rc=0
          bash .claude/scripts/check-capability-activation.sh || rc=$?
          echo "== gate installé (rc=$rc) =="
          # Un exit 2 (NON VÉRIFIABLE) échoue le job au même titre qu'un exit 1 — un gate qui ne peut
          # pas se prononcer n'est pas un gate vert.
          [ "$rc" -eq 0 ]

      - name: "Plancher d'opposabilité du job : au moins deux artefacts armés installés"
        # Deux et non un : avec un seul, un futur changement de fermeture viderait l'ensemble sans
        # que ce job ne le distingue d'un vert légitime. État mesuré (Phase 28) : vf-coder.md et
        # vf-reviewer.md, tous deux posés par dev-orchestrator, tous deux porteurs de
        # `vf-requires: mcp-servers` depuis 28-02 ; les trois agents de mobile-test-team restent hors
        # champ, ce module n'appartenant à aucune fermeture mesurée. Compte en awk, jamais en grep
        # pipé (le grep de ce poste tronque silencieusement).
        run: |
          set -eu
          cd "$LAB_ARME"
          armed_count=$(awk '
            FNR==1 { fm=0 }
            $0=="---" { fm++; next }
            fm==1 && ($0 ~ /^isolation:[ \t]*[^ \t]/ || $0 ~ /^vf-mcp-consumer:[ \t]*[^ \t]/ || $0 ~ /^vf-mcp-tools:[ \t]*[^ \t]/) { print FILENAME }
          ' .claude/agents/*.md 2>/dev/null | sort -u | awk 'END{print NR+0}')
          echo "== artefacts armés installés : $armed_count =="
          if [ "$armed_count" -lt 2 ]; then
            echo "::error::univers d'armement du lab installé < 2 ($armed_count) — le job refuse de rendre un verdict sur un univers vide"
            exit 1
          fi

      - name: "Forme exec telle qu'installée (PORT-05) — settings.json/settings.local.json POSÉS par le lab armé"
        # POURQUOI CETTE ÉTAPE EXISTE. Régression #38 : un gate qui n'exerce que l'arbre source ne
        # prouve rien sur ce que l'install pose CHEZ L'UTILISATEUR — patron as-installed déjà en
        # place plus haut dans ce même job (Phase 28, ARMD-06/ARMD-08), réutilisé ici pour PORT-05.
        # Les assertions portent donc sur $LAB_ARME/.claude/settings*.json, jamais sur les fragments
        # hooks.json de $GITHUB_WORKSPACE. La suite locale (plugin/_internal/tests/
        # test-vibeflow-update.sh, T10, plan 30-07) prouve la même chose dans un mktemp -d local :
        # cette étape-ci n'en duplique pas le code, elle l'exerce sur l'install réelle de CI.
        #
        # merge-hooks.sh route les entrées {{VF_BASH}} vers settings.local.json (chemin résolu et
        # vérifié à l'install) et laisse en l'état, dans settings.json, la seule entrée dont le
        # command est un nom nu volontaire : check-hook-paths.sh (dérogation nommée à ADR-071
        # §Décision 2, approuvée le 2026-08-15 — paradoxe d'amorçage documenté par
        # docs/HOOKS-CONTRAT-SORTIE.md §4, gardée par ailleurs par le cas T9 de
        # test-check-hook-paths.sh). Les DEUX fichiers sont donc regardés ici ; l'exception est
        # nommée explicitement, pas silencieuse.
        #
        # L'ATTENDU N'EST PLUS UN LITTÉRAL. Un chiffre codé en dur décrivait un univers
        # (dev-orchestrator + software-architecture) que CE job n'installe jamais : sa fermeture
        # ($closure) ne contient QUE dev-orchestrator, `software-architecture` n'y arrive par
        # aucune arête — l'attendu doit donc se dériver de la fermeture RÉELLEMENT installée, pas
        # d'une install locale d'un univers différent (leçon vécue : run CI 31917741411, « attendu
        # 6, présentes 5 »). Les deux sources restent INDÉPENDANTES : l'attendu vient des
        # `hooks.json` sources des modules de la fermeture (arbre $GITHUB_WORKSPACE), le constat
        # vient de ce que l'install a POSÉ dans $LAB_ARME — ni l'un ni l'autre n'est recalculé à
        # partir du même code, donc aucun des deux ne peut se satisfaire lui-même à vide.
        run: |
          set -eu
          closure=$(bash plugin/_internal/resolve-deps.sh dev-orchestrator)
          if ! printf '%s\n' "$closure" | awk '$0=="dev-orchestrator"{f=1} END{exit !f}'; then
            echo "::error::fermeture résolue sans dev-orchestrator — attendu non fiable, refus de continuer"
            exit 1
          fi
          echo "== fermeture (source de l'attendu, indépendante du posé) : $closure =="
          expect_total=$(python3 - <<PYEOF
          import json, glob
          closure = """$closure""".split()
          n = 0
          for m in closure:
              for f in glob.glob(f"plugin/{m}/hooks/hooks.json"):
                  d = json.load(open(f, encoding="utf-8"))
                  for ev, groups in d.get("hooks", {}).items():
                      for g in groups or []:
                          for h in g.get("hooks", []) or []:
                              if "args" in h:
                                  n += 1
          print(n)
          PYEOF
          )
          if [ -z "$expect_total" ] || [ "$expect_total" -le 0 ]; then
            echo "::error::attendu dérivé de la fermeture <= 0 ($expect_total) — refus de comparer contre une cible source vide"
            exit 1
          fi
          echo "== attendu dérivé des hooks.json de la fermeture : $expect_total entrée(s) VF =="

          cd "$LAB_ARME"
          python3 - "$expect_total" <<'PYEOF'
          import json, os, re, sys

          EXPECT_TOTAL = int(sys.argv[1])
          BARE_COMMAND_EXCEPTION = "check-hook-paths.sh"
          SHELL_METACHARS = ("&&", "||", ";", "|", "`", "$(")
          SCRIPT_RE = re.compile(r"([A-Za-z0-9_-]+\.(?:sh|py))")

          def find_script_name(args):
              for a in args:
                  if not isinstance(a, str):
                      continue
                  m = SCRIPT_RE.search(a)
                  if m:
                      return m.group(1)
              return None

          fail = []

          def load(path):
              if not os.path.isfile(path):
                  return {}
              raw = open(path, encoding="utf-8").read()
              if "{{" in raw:
                  fail.append(f"{path} : placeholder littéral {{ résiduel")
              try:
                  return json.loads(raw) if raw.strip() else {}
              except Exception as e:
                  fail.append(f"{path} : JSON invalide ({e})")
                  return {}

          entries = []
          for path in (".claude/settings.json", ".claude/settings.local.json"):
              d = load(path)
              for ev, groups in d.get("hooks", {}).items():
                  for g in groups or []:
                      for h in g.get("hooks", []) or []:
                          if "args" in h:
                              entries.append((path, h))

          if not entries:
              print("::error::0 entrée VF posée dans settings.json/settings.local.json — garde anti-vert-à-vide")
              sys.exit(1)

          if len(entries) != EXPECT_TOTAL:
              names = [find_script_name(h.get("args", []) or []) or "?" for _, h in entries]
              fail.append(f"{len(entries)} entrée(s) VF posée(s), attendu {EXPECT_TOTAL} (dérivé de la fermeture) — présentes : {sorted(names)}")

          for path, h in entries:
              cmd = h.get("command", "")
              args = h.get("args", []) or []
              script_name = find_script_name(args)
              is_bare_exception = script_name == BARE_COMMAND_EXCEPTION
              if is_bare_exception:
                  if cmd != "bash":
                      fail.append(f"{path} : {script_name} — dérogation attendue (command=='bash'), obtenu {cmd!r}")
              else:
                  if not cmd.startswith("/") or not (os.path.isfile(cmd) and os.access(cmd, os.X_OK)):
                      fail.append(f"{path} : {script_name or '?'} — command non absolu/exécutable sur ce runner : {cmd!r}")
              for s in [cmd] + [a for a in args if isinstance(a, str)]:
                  if any(m in s for m in SHELL_METACHARS):
                      fail.append(f"{path} : {script_name or '?'} — construction shell détectée dans {s!r}")

          if fail:
              for f in fail:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"== forme exec telle qu'installée : {len(entries)} entrée(s) VF, command absolu+exécutable (sauf dérogation nommée check-hook-paths.sh), aucun placeholder, aucune construction shell ==")
          PYEOF

      - name: "Conditions Windows simulées (PORT-05) — les deux suites nommées, repli assumé d'ADR-054"
        # AUCUN runner Windows réel n'existe dans ce dépôt (ni ici, ni ailleurs dans ce workflow) :
        # cette étape ne prouve PAS un comportement Windows natif. Elle exécute NOMMÉMENT, sur ce
        # runner ubuntu-latest, les deux suites qui SIMULENT les conditions Windows par fixtures
        # (retours chariot CRLF, antislashs, stub du magasin d'applications Windows) — repli
        # explicitement assumé et documenté par ADR-054, pas une approximation silencieuse. Les deux
        # suites tournent déjà par découverte dans le job "tests" plus haut ; les nommer ICI rend la
        # preuve de PORT-05 lisible dans le journal de CI, au lieu de rester noyée dans une
        # découverte anonyme parmi 61 suites.
        run: |
          set -eu
          echo "== test-windows-crlf.sh (simulation CRLF/antislashs — pas de poste Windows réel) =="
          bash plugin/_internal/tests/test-windows-crlf.sh
          echo "== test-windows-guards.sh (simulation stub magasin d'applications — pas de poste Windows réel) =="
          bash plugin/consolidator/scripts/tests/test-windows-guards.sh
